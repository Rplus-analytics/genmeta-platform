<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data quality prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2A57;--deep:#07111F;--royal:#4D8CFF;--sky:#A9D3FF;--ice:#EDF4FF;--mist:#F6FBFF;--canvas:#F3F6FA;--line:#D7E1EC;--line2:#C9D6E6;--muted:#566A89;--faint:#8694AB;--white:#fff;
--r-ctl:8px;--r-card:12px;--shadow-1:0 1px 2px rgba(14,42,87,.06),0 1px 1px rgba(14,42,87,.04);--ring:0 0 0 2px #fff,0 0 0 4px var(--royal);--h-sm:28px;--h-md:32px;--h-lg:36px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 'Hanken Grotesk',system-ui,sans-serif;color:var(--navy);background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
/* chrome */
.top{position:fixed;inset:0 0 auto 0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 16px;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;width:220px}
.logo .rp{font-family:Georgia,serif;font-size:20px}
.logo .sep{width:1px;height:20px;background:var(--line2)}
.logo .gm{color:var(--navy)}.logo .gm i{font-style:normal;color:var(--royal)}
.crumbs{font-size:13px;color:var(--muted)}.crumbs b{color:var(--navy);font-weight:600}
.search{margin-left:auto;margin-right:auto;width:400px;height:34px;border-radius:var(--r-ctl);background:var(--canvas);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--faint);font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6FA6FF,#3F7BEA);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.rail{position:fixed;top:56px;bottom:0;left:0;width:56px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;z-index:10}
.rail a{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.rail a.on{background:var(--ice);color:var(--royal)}
.rail a:hover{background:var(--mist)}
.inner{position:fixed;top:56px;bottom:0;left:56px;width:268px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:9}
.inner-h{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.inner-b{overflow:auto;padding:10px 10px 24px;flex:1}
.main{margin-left:324px;padding:72px 32px 40px}
/* inner menu */
.msearch{height:32px;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:var(--r-ctl);padding:0 10px;margin-bottom:8px}
.msearch input{border:0;outline:0;flex:1;font-size:13px;background:transparent}
.mlink{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--navy);user-select:none}
.mlink:hover{background:var(--mist)}
.mlink.on{background:var(--ice);font-weight:600}
.mlink.on svg{color:var(--royal)}
.mlink .cnt{margin-left:auto;font-size:11.5px;color:var(--faint)}
.mlink .chev{width:14px;color:var(--faint);transition:transform .15s;flex:none}
.mlink .chev.open{transform:rotate(90deg)}
.tchild{padding-left:22px}
.tchild2{padding-left:40px}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.sec{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:14px 8px 6px;cursor:pointer}
.divider{height:1px;background:var(--line);margin:12px 4px}
.fbox{border:1px solid var(--line);border-radius:var(--r-ctl);padding:4px;margin:0 4px}
.chk{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px;font-size:13px;border-radius:5px;cursor:pointer}
.chk:hover{background:var(--mist)}
.chk input{accent-color:var(--royal)}
.chk .cnt{margin-left:auto;font-size:11.5px;color:var(--faint)}
/* shared */
.eyebrow{font:500 11px 'JetBrains Mono';letter-spacing:.14em;color:var(--royal);text-transform:uppercase}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.phead h1{margin:4px 0 4px;font-size:26px;font-weight:600;letter-spacing:-.01em}
.phead p{margin:0;color:var(--muted);font-size:13.5px}
.btn{height:var(--h-lg);padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--line2);background:#fff;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--mist);border-color:var(--muted)}
.btn:focus-visible,.mlink:focus-visible,.tab:focus-visible,.ib:focus-visible{outline:0;box-shadow:var(--ring)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--deep)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--ice)}
.btn.sm{height:var(--h-sm);padding:0 10px;font-size:12.5px}
.btn.md{height:var(--h-md);padding:0 12px;font-size:13px}
.btn:disabled{background:var(--ice);border-color:var(--line);color:var(--faint);cursor:not-allowed}
.ib{width:32px;height:32px;border-radius:var(--r-ctl);border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--ice);color:var(--navy)}
.ib.on{color:var(--royal)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1)}
.card.pad{padding:18px 20px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1);margin-bottom:16px}
.tiles>div{padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.tiles>div:first-child{border-left:0}
.tiles b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.tiles span{font-size:12.5px;font-weight:600}
.tiles small{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%}
.b-approved{background:var(--ice);color:var(--navy)}.b-approved i{background:var(--royal)}
.b-review{background:#fff;color:var(--royal);border:1px solid rgba(77,140,255,.55)}.b-review i{background:var(--royal)}
.b-draft{background:#F3F5F8;color:var(--muted);border:1px dashed var(--line2)}.b-draft i{background:var(--faint)}
.b-deprecated{background:#fff;color:var(--faint);border:1px solid var(--line)}.b-deprecated i{background:#fff;border:1.5px solid var(--faint)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--mist);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:#fff;font-size:12.5px;cursor:pointer}
.chip:hover{background:var(--mist)}
.chip.on{background:var(--ice);border-color:var(--royal)}
.chip small{color:var(--faint)}
.seg2{display:inline-flex;background:#fff;border:1px solid var(--line2);border-radius:var(--r-ctl);padding:2px;gap:2px}
.seg2 button{height:26px;border:0;background:transparent;border-radius:6px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg2 button:hover{background:var(--mist);color:var(--navy)}
.seg2 button.on{background:var(--ice);color:var(--navy)}
.input{height:var(--h-md);border:1px solid var(--line2);border-radius:var(--r-ctl);padding:0 10px;background:#fff;outline:0;font-size:13px}
.input:focus,textarea:focus{box-shadow:var(--ring);border-color:var(--royal)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;min-height:72px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--mist)}
.tbl .tname{display:flex;align-items:center;gap:8px;font-weight:600}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.plist>div{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.plist>div:last-child{border-bottom:0}
.plist small{display:block;font-size:12px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin-top:10px}
.tlink{color:var(--royal);font-weight:500;cursor:pointer}
.tlink:hover{text-decoration:underline;text-underline-offset:3px}
/* term profile */
.thead{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.ticon{width:44px;height:44px;border-radius:10px;background:var(--ice);color:var(--royal);display:grid;place-items:center;flex:none}
.thead h1{margin:0;font-size:24px;font-weight:600;display:flex;align-items:center;gap:10px}
.thead .kind{font-size:12.5px;color:var(--muted);margin-top:2px}
.tools{margin-left:auto;display:flex;align-items:center;gap:2px}
.banner{display:flex;align-items:center;gap:10px;border:1px solid rgba(77,140,255,.35);background:var(--mist);border-radius:var(--r-ctl);padding:10px 14px;font-size:13px;margin-bottom:14px}
.banner .btn{margin-left:auto}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:16px;height:44px;align-items:flex-end}
.tab{height:44px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;cursor:pointer;padding:0}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--royal)}
.tab small{font-size:11.5px;background:var(--ice);border-radius:99px;padding:0 6px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.side{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:6px 18px 12px;position:sticky;top:72px}
.prop{padding:11px 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.prop .v{font-size:13.5px;font-weight:500;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.person{display:inline-flex;align-items:center;gap:6px}
.person i{width:20px;height:20px;border-radius:50%;background:var(--ice);color:var(--royal);font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center}
.cert{background:var(--ice);border-radius:var(--r-ctl);padding:8px 10px;font-size:12.5px}
.cert b{display:flex;align-items:center;gap:6px}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:4px 0}
.arow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow:hover{background:var(--mist)}
.aico{width:30px;height:30px;border-radius:8px;background:var(--ice);color:var(--royal);display:grid;place-items:center;flex:none}
.arow .an{font-family:'JetBrains Mono';font-size:12.5px;font-weight:500;color:var(--royal);cursor:pointer}
.arow .am{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-top:2px}
.arow .ib{margin-left:auto}
.hist>div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist>div:last-child{border-bottom:0}
.hist .dot{width:9px;height:9px;border-radius:50%;background:var(--royal);margin-top:5px;flex:none;box-shadow:0 0 0 3px var(--ice)}
.hist small{display:block;color:var(--muted);font-size:12px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.formgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.formgrid label,.fld label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.fld{margin-bottom:12px}
.fld .input{width:100%}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(7,17,31,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;z-index:41;box-shadow:-20px 0 40px -20px rgba(14,42,87,.3);display:flex;flex-direction:column}
.drawer header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.drawer .db{padding:18px 20px;overflow:auto;flex:1}
.drawer footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal{position:fixed;left:50%;top:30%;transform:translate(-50%,-30%);width:420px;background:#fff;border-radius:14px;z-index:41;padding:20px;box-shadow:0 20px 50px -20px rgba(14,42,87,.4)}
.modal h3{margin:0 0 6px;font-size:17px}
.menu{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px -10px rgba(14,42,87,.3);padding:4px;min-width:200px;z-index:30}
.menu button{display:flex;width:100%;align-items:center;gap:8px;height:32px;border:0;background:none;border-radius:6px;padding:0 10px;font-size:13px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--mist)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 10px 30px -10px rgba(7,17,31,.5)}
.proto{position:fixed;left:340px;bottom:16px;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);box-shadow:var(--shadow-1)}
.graph svg{display:block;width:100%;height:auto}
.gnode{cursor:pointer}
.gnode:hover rect{stroke:var(--royal)}
/* ---- data quality additions ---- */
.sev{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.sev i{width:8px;height:8px;border-radius:2px}
.s-high i{background:#0E2A57}.s-medium i{background:#4D8CFF}.s-low i{background:#A9D3FF}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%}
.st-triage{color:var(--navy)}.st-triage i{background:#fff;border:1.5px solid var(--navy)}
.st-investigating{color:var(--royal);border-color:rgba(77,140,255,.5)}.st-investigating i{background:var(--royal)}
.st-resolved{background:var(--ice);color:var(--navy);border-color:var(--ice)}.st-resolved i{background:var(--navy)}
.st-fp{color:var(--faint);border-style:dashed}.st-fp i{background:var(--faint)}
.pri{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.pri b{display:inline-flex;gap:1px;align-items:flex-end;height:10px}
.pri b u{width:3px;background:var(--line2);display:block}
.pri b u.on{background:var(--navy)}
.score{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:600}
.score .bar{width:54px;height:6px;border-radius:9px;background:var(--ice);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--royal);border-radius:9px}
.score.bad .bar i{background:var(--navy)}
.dimcell{font-variant-numeric:tabular-nums;text-align:right}
.dimcell.lo{color:var(--navy);font-weight:700}
.dimcell.na{color:var(--faint);font-style:italic;text-align:left}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px}
.legend b{color:var(--navy)}
.chart svg{display:block;width:100%;height:auto}
.feed>div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed>div:last-child{border-bottom:0}
.feed .who{width:24px;height:24px;border-radius:50%;background:var(--ice);color:var(--royal);font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}
.feed small{display:block;color:var(--muted);font-size:12px}
.daylbl{font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px}
.tiles.t7{grid-template-columns:repeat(7,minmax(0,1fr))}
.tiles.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles .lo{color:var(--navy)}
.tiles .delta{font-size:11.5px;color:var(--royal);font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--mist);border:1px solid var(--line);border-radius:var(--r-ctl);padding:10px 14px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.note svg{flex:none;color:var(--royal);margin-top:1px}
.note b{color:var(--navy)}
.bulk{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:var(--r-ctl);padding:6px 8px 6px 14px;margin-bottom:10px;font-size:13px}
.bulk .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.bulk .btn:hover{background:rgba(255,255,255,.1)}
.steps{display:flex;flex-direction:column;gap:0;margin:0;padding-left:12px}
.step{border-left:2px solid var(--line);padding:0 0 18px 18px;position:relative}
.step:last-child{padding-bottom:4px}
.step .n{position:absolute;left:-12px;top:0;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line2);font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--muted)}
.step.on .n{border-color:var(--royal);color:var(--royal)}
.step.done .n{background:var(--royal);border-color:var(--royal);color:#fff}
.step h4{margin:1px 0 2px;font-size:14px}
.step .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.step.off h4{color:var(--faint)}
.dimpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dimpick button{border:1px solid var(--line2);background:#fff;border-radius:var(--r-ctl);padding:10px;text-align:left;cursor:pointer}
.dimpick button:hover{background:var(--mist)}
.dimpick button.on{border-color:var(--royal);background:var(--ice)}
.dimpick b{display:block;font-size:13px}
.dimpick small{font-size:11.5px;color:var(--muted)}
.tpl{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.tpl label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:var(--r-ctl);padding:8px 10px;font-size:13px;cursor:pointer}
.tpl label.on{border-color:var(--royal);background:var(--mist)}
.tpl input{accent-color:var(--royal)}
.plain{background:var(--ice);border-radius:var(--r-ctl);padding:10px 12px;font-size:13px;line-height:1.5}
.plain code{font-family:'JetBrains Mono';font-size:12px;background:#fff;border-radius:4px;padding:1px 5px}
.cbx{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.cbx label{display:flex;align-items:center;gap:6px}
.cbx input{accent-color:var(--royal)}
.drawer.wide{width:560px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:600}
.dimrow{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.dimrow:last-child{border-bottom:0}
.dimrow .why{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.dimrow .bar{height:7px;background:var(--ice);border-radius:9px;overflow:hidden}
.dimrow .bar i{display:block;height:100%;background:var(--royal)}
.code{font-family:'JetBrains Mono';font-size:12px;background:var(--deep);color:#DCE8FF;border-radius:var(--r-ctl);padding:12px 14px;white-space:pre;overflow:auto;line-height:1.55}
.kd{font-size:11px;font-weight:600;border-radius:5px;padding:2px 6px;background:var(--mist);border:1px solid var(--line);color:var(--muted)}
.kd.anom{background:#fff;border-color:var(--royal);color:var(--royal)}
.views{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.cmt{display:flex;gap:8px;margin-top:10px}
.cmt .input{flex:1}
th input,td input[type=checkbox]{accent-color:var(--royal)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols3{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.mini{display:flex;gap:1px;align-items:flex-end;height:16px}
.mini i{width:4px;display:block;border-radius:1px}

/* ---------- charts */
function qualityChart(h=170){
 const W=760,H=h,pl=34,pr=8,pt=10,pb=22,n=TREND.length,bw=(W-pl-pr)/n;
 const mx=Math.max(...TREND.map(d=>d.h+d.m+d.l))||1;const barH=(H-pt-pb)*.42;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Data quality over time">`;
 [0,50,100].forEach(v=>{const y=pt+(H-pt-pb)*(1-v/100);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#E3EAF3"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#8694AB">${v}%</text>`});
 TREND.forEach((d,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6;let y=H-pb;[['h','#0E2A57'],['m','#4D8CFF'],['l','#A9D3FF']].forEach(([k,c])=>{const hh=d[k]/mx*barH;if(hh){y-=hh;s+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${c}" rx="1"><title>${DAYS[i]}: ${d.h} high, ${d.m} medium, ${d.l} low · score ${d.sc}%</title></rect>`}})});
 const pts=TREND.map((d,i)=>[pl+i*bw+bw/2,pt+(H-pt-pb)*(1-d.sc/100)]);
 s+=`<path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" stroke="#4D8CFF" stroke-width="2"/>`;
 pts.forEach((p,i)=>{if(i%1==0)s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="#fff" stroke="#4D8CFF" stroke-width="1.5"><title>${DAYS[i]} · ${TREND[i].sc}%</title></circle>`});
 [0,7,14,21,29].forEach(i=>s+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="#8694AB">${DAYS[i]}</text>`);
 return s+'</svg>'}
function qualityLegend(){const t=TREND.reduce((a,d)=>({h:a.h+d.h,m:a.m+d.m,l:a.l+d.l,n:a.n+d.non}),{h:0,m:0,l:0,n:0});
 return `<div class="legend"><span><i style="background:#0E2A57"></i>High <b>${t.h}</b></span><span><i style="background:#4D8CFF"></i>Medium <b>${t.m}</b></span><span><i style="background:#A9D3FF"></i>Low <b>${t.l}</b></span><span><i style="background:#fff;border:1px solid var(--line2)"></i>Passed checks <b>${t.n}</b></span><span><i style="background:none;border-top:2px solid #4D8CFF;height:0;border-radius:0;width:14px"></i>Quality score</span></div>`}
function ttrChart(){
 const W=760,H=170,pl=34,pr=8,pt=10,pb=22,n=TREND.length,bw=(W-pl-pr)/n;const mx=Math.max(...TREND.map(d=>d.res+d.fp+d.inv+d.tri))||1;const barH=(H-pt-pb)*.5;const mt=40;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Time to resolution">`;
 [0,20,40].forEach(v=>{const y=pt+(H-pt-pb)*(1-v/mt);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#E3EAF3"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#8694AB">${v}h</text>`});
 TREND.forEach((d,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6;let y=H-pb;[['res','#0E2A57'],['fp','#C9D6E6'],['inv','#4D8CFF'],['tri','#A9D3FF']].forEach(([k,c])=>{const hh=d[k]/mx*barH;if(hh){y-=hh;s+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${c}" rx="1"><title>${DAYS[i]}: ${d.res} resolved, ${d.fp} false positive, ${d.inv} investigating, ${d.tri} triage · ${d.ttr} h to resolve</title></rect>`}})});
 const pts=TREND.map((d,i)=>[pl+i*bw+bw/2,pt+(H-pt-pb)*(1-d.ttr/mt)]);
 s+=`<path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" stroke="#0E2A57" stroke-width="1.8"/>`;
 [0,7,14,21,29].forEach(i=>s+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="#8694AB">${DAYS[i]}</text>`);
 return s+'</svg>'}
const ttrLegend=()=>`<div class="legend"><span><i style="background:#0E2A57"></i>Resolved <b>${TREND.reduce((a,d)=>a+d.res,0)}</b></span><span><i style="background:#C9D6E6"></i>False positive <b>${TREND.reduce((a,d)=>a+d.fp,0)}</b></span><span><i style="background:#4D8CFF"></i>Investigating <b>${INCIDENTS.filter(i=>i.status=='investigating').length}</b></span><span><i style="background:#A9D3FF"></i>Triage <b>${INCIDENTS.filter(i=>i.status=='triage').length}</b></span></div>`;
function ring(v,size=88,c='#4D8CFF'){const r=size/2-7,C=2*Math.PI*r;return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EDF4FF" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${v<60?'#0E2A57':c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><b style="font-size:${size/4.4}px">${v}%</b></div>`}
function miniHist(inc){const k=inc.sev=='high'?[3,5,2,6,4]:inc.sev=='medium'?[2,3,1,4,2]:[1,2,1,1,2];const c={high:'#0E2A57',medium:'#4D8CFF',low:'#A9D3FF'}[inc.sev];return `<span class="mini">${k.slice(0,Math.min(5,inc.n+1)).map(h=>`<i style="height:${h*2.4}px;background:${c}"></i>`).join('')}</span>`}

 `<div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th>Asset</th><th class="num">Rows</th>${DIMS.map(d=>`<th class="num">${DIML[d]}</th>`).join('')}<th>Score</th><th>Priority</th><th>Owner</th></tr></thead><tbody>${rows.map(a=>`<tr onclick="go('asset',{asset:'${a.n}',atab:'overview'})"><td><span class="tname mono" style="font-size:12.5px">${esc(a.n)}</span><small class="faint">${esc(a.sys)} · ${a.t} · <b style="font-weight:600;color:var(--muted)">${methodOf(a)}</b></small></td>${a.d?`<td class="num">${a.rows}</td>`+a.d.map(v=>v==null?'<td class="dimcell na">not measured</td>':`<td class="dimcell ${v<60?'lo':''}">${v}</td>`).join(''):`<td></td><td colspan="6" class="dimcell na">${a.m=='error'?esc(a.err):'structure only · no values to measure'}</td>`}<td>${scoreB(a.score)}</td><td>${priB(a.pri)}</td><td>${person(a.own)}</td></tr>`).join('')}</tbody></table></div><p class="foot">${rows.length} assets · last profiled ${ui.lastRun}</p>`}

 `<div class="toolbar"><div class="msearch" style="width:280px;margin:0">${I.search}<input placeholder="Search rules"></div><span class="chip">Dimension <small>All</small></span><span class="chip">Severity <small>All</small></span><span class="chip">Written by <small>All</small></span><span class="views" style="margin-left:auto"><span class="tlink" onclick="toast('View saved')">Save as view</span></span></div>`+
 `<div class="card" style="overflow:auto">${rulesTable(RULES)}</div><p class="foot">Self-remediation actions need a governance lead or product owner to authorise them.</p>`}
function openRule(asset){ui.drawer={kind:'rule',dim:null,tpl:null,to:asset||'',scope:asset?'One asset':'One asset',col:'',run:'Every harvest (15 min)',seg:'',thrType:'fixed',thr:100,sens:2,adapt:'Slow',sev:'medium',owner:'Madhavi',why:'',acts:[],auth:'',p1:'',p2:'',name:''};draw()}
function rd(k,v){ui.drawer[k]=v;draw()}
function ruleSentence(d){if(!d.tpl)return 'Pick a dimension and a check to see what this rule will do.';
 const t=d.thrType=='fixed'?`at least <code>${d.thr}%</code> of checks pass`:`the value stays inside the band GenMeta learns, with sensitivity <code>${d.sens}</code> and a <code>${d.adapt.toLowerCase()}</code> adaptation rate`;
 return `GenMeta will check <b>${esc(d.tpl.toLowerCase())}</b> on <code>${esc(d.to||'…')}</code>${paramText(d)}${d.col?` column <code>${esc(d.col)}</code>`:''}${d.seg?`, split by <code>${esc(d.seg)}</code>`:''}, <b>${d.run.toLowerCase()}</b>. It passes when ${t}. If it fails, a <b>${d.sev}</b> incident goes to ${esc(d.owner)}${d.acts.length&&d.auth?` and GenMeta will ${d.acts.map(a=>ACTL[a].toLowerCase()).join(', ')}`:''}.`}
function ruleDrawer(){const d=ui.drawer;const s1=!!d.tpl,s2=s1&&!!d.to;
 const step=(n,on,done,t,sub,body)=>`<div class="step ${done?'done':on?'on':'off'}"><span class="n">${done?'✓':n}</span><h4>${t}</h4><div class="sub">${sub}</div>${body}</div>`;
 const assetOpts=ASSETS.filter(a=>a.d).map(a=>`<option ${a.n==d.to?'selected':''}>${a.n}</option>`).join('');
 return `<div class="scrim" onclick="ui.drawer=null;draw()"></div><aside class="drawer wide" role="dialog" aria-label="New rule"><header>Write a rule<button class="ib" onclick="ui.drawer=null;draw()">${I.x}</button></header><div class="db"><div class="steps">
 ${step(1,true,s1,'What should it check?','Pick a dimension, then a plain template. No SQL.',`<div class="dimpick">${DIMS.map(x=>`<button class="${d.dim==x?'on':''}" onclick="ui.drawer.dim='${x}';ui.drawer.tpl=null;draw()"><b>${DIML[x]}</b><small>${DIMD[x]}</small></button>`).join('')}</div>${d.dim?`<div class="tpl">${TEMPLATES[d.dim].map(([t,s])=>`<label class="${d.tpl==t?'on':''}"><input type="radio" name="tpl" ${d.tpl==t?'checked':''} onclick='ui.drawer.tpl=${JSON.stringify(t)};if(!ui.drawer.name)ui.drawer.name=${JSON.stringify(t)};draw()'><span><b>${t}</b><br><small class="muted">${s}</small></span></label>`).join('')}</div>`:''}`)}
 ${step(2,s1,s2,'Where does it apply?','Everything profiled, one asset, a dataset or a classification.',`<div class="formgrid" style="grid-template-columns:1fr 1fr"><div class="fld"><label>Applies to</label><select class="input" onchange="rd('scope',this.value)">${['Everything profiled','One asset','A dataset','A classification'].map(o=>`<option ${d.scope==o?'selected':''}>${o}</option>`).join('')}</select></div><div class="fld"><label>Asset</label><select class="input" onchange="rd('to',this.value)"><option value="">Choose…</option>${assetOpts}</select></div><div class="fld"><label>Column</label><input class="input" placeholder="e.g. CUSTOMER_EMAIL" value="${esc(d.col)}" onchange="rd('col',this.value)"></div><div class="fld"><label>Split by (optional)</label><input class="input" placeholder="e.g. SEGMENT" value="${esc(d.seg)}" onchange="rd('seg',this.value)"></div>${paramField(d)}</div>`)}
 ${step(3,s2,s2,'When does it run?','Checks run on every scheduled harvest and again the moment data changes.',`<div class="seg2">${['Every harvest (15 min)','Daily window','On data change'].map(o=>`<button class="${d.run==o?'on':''}" onclick='rd("run",${JSON.stringify(o)})'>${o}</button>`).join('')}</div>`)}
 ${step(4,s2,s2,'When is it a failure?','Fixed: you set the pass mark. Learned: GenMeta learns what is normal.',`<div class="seg2" style="margin-bottom:10px"><button class="${d.thrType=='fixed'?'on':''}" onclick="rd('thrType','fixed')">Fixed</button><button class="${d.thrType=='learned'?'on':''}" onclick="rd('thrType','learned')">Learned</button></div>${d.thrType=='fixed'?`<div class="fld" style="max-width:180px"><label>Passes at ≥ %</label><input class="input" type="number" min="0" max="100" value="${d.thr}" onchange="rd('thr',this.value)"></div>`:`<div class="formgrid" style="grid-template-columns:1fr 1fr"><div class="fld"><label>Sensitivity (1 = loose, 5 = strict)</label><select class="input" onchange="rd('sens',this.value)">${[1,2,3,4,5].map(o=>`<option ${d.sens==o?'selected':''}>${o}</option>`).join('')}</select></div><div class="fld"><label>Adaptation rate</label><select class="input" onchange="rd('adapt',this.value)">${['Slow','Fast'].map(o=>`<option ${d.adapt==o?'selected':''}>${o}</option>`).join('')}</select></div></div>`}`)}
 ${step(5,s2,s2&&!!d.name,'Details and what happens next','Severity, owner, why it matters and self-remediation.',`<div class="fld"><label>Name</label><input class="input" value="${esc(d.name)}" onchange="rd('name',this.value)"></div><div class="formgrid"><div class="fld"><label>Severity</label><select class="input" onchange="rd('sev',this.value)">${['high','medium','low'].map(o=>`<option ${d.sev==o?'selected':''}>${o}</option>`).join('')}</select></div><div class="fld" style="grid-column:span 2"><label>Business owner</label><select class="input" onchange="rd('owner',this.value)">${Object.keys(PEOPLE).filter(p=>p!='Admin').map(o=>`<option ${d.owner==o?'selected':''}>${o}</option>`).join('')}</select></div></div><div class="fld"><label>Why it matters</label><textarea class="input" onchange="rd('why',this.value)" placeholder="e.g. Duplicates double-count revenue">${esc(d.why)}</textarea></div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">Self-remediation · only a governance lead or product owner can authorise</label><div class="fld"><select class="input" onchange="ui.drawer.auth=this.value;if(!this.value)ui.drawer.acts=[];draw()"><option value="">Not authorised: alert only</option>${AUTHORISERS.map(p=>`<option ${d.auth==p?'selected':''}>${p}</option>`).join('')}</select></div><div class="cbx" style="${d.auth?'':'opacity:.5'}">${Object.entries(ACTL).map(([k,v])=>`<label><input type="checkbox" ${d.auth?'':'disabled'} ${d.acts.includes(k)?'checked':''} onchange="const a=ui.drawer.acts;this.checked?a.push('${k}'):a.splice(a.indexOf('${k}'),1);draw()">${v}</label>`).join('')}</div>`)}
 </div><div class="plain" style="margin-top:6px">${ruleSentence(d)}</div></div><footer><button class="btn md" onclick="ui.drawer=null;draw()">Cancel</button><button class="btn md primary" ${s2&&d.name?'':'disabled'} onclick="saveRule()">Save rule</button></footer></aside>`}
function saveRule(){const d=ui.drawer;RULES.unshift({id:'R'+(RULES.length+1),name:d.name,check:d.tpl,dim:d.dim,to:d.to,col:d.col||'—',thr:d.thrType=='fixed'?'≥ '+d.thr+'%':'learned · sensitivity '+d.sens,type:d.thrType,sev:d.sev,on:d.auth?[...d.acts]:[],auth:d.auth,by:'Admin',q:100,last:'never',why:d.why,enabled:true});ui.drawer=null;go('rules');toast('Rule saved. It runs on the next harvest.')}

function incTable(rows,sel=true){if(!rows.length)return '<div class="empty">No incidents match. Checks run on every harvest.</div>';
 return `<table class="tbl"><thead><tr>${sel?`<th style="width:28px"><input type="checkbox" aria-label="Select all" ${rows.every(r=>ui.sel.has(r.id))?'checked':''} onclick="event.stopPropagation();${rows.every(r=>ui.sel.has(r.id))?'ui.sel.clear()':`[${rows.map(r=>`'${r.id}'`)}].forEach(i=>ui.sel.add(i))`};render()"></th>`:''}<th>Incidents</th><th>Group</th><th>Asset</th><th>Status</th><th>Priority</th><th>Owner</th><th>First seen</th><th>Last seen</th><th></th></tr></thead><tbody>${rows.map(i=>`<tr onclick="go('incident',{inc:'${i.id}',itab:'overview'})">${sel?`<td onclick="event.stopPropagation()"><input type="checkbox" ${ui.sel.has(i.id)?'checked':''} onchange="this.checked?ui.sel.add('${i.id}'):ui.sel.delete('${i.id}');render()"></td>`:''}<td><div style="display:flex;align-items:center;gap:8px">${miniHist(i)}${sevB(i.sev)} <span class="faint">${i.n}</span></div></td><td style="min-width:220px"><div class="tname">${esc(i.title)}</div><div style="display:flex;gap:6px;align-items:center;margin-top:3px"><small class="faint mono">${i.id}</small><span class="kd ${i.kind=='Anomaly'?'anom':''}">${i.kind}</span><span class="kd">${DIML[i.dim]}</span></div></td><td class="mono" style="font-size:12px">${esc(i.asset)}</td><td>${stB(i.status,i.id)}</td><td>${priB(i.pri)}</td><td>${person(i.own)}</td><td class="muted" style="font-size:12.5px">${i.first}</td><td class="muted" style="font-size:12.5px">${i.last}</td><td><button class="ib" title="${i.muted?'Unmute':'Mute'}" onclick="event.stopPropagation();mute('${i.id}')">${i.muted?I.mute:I.bell}</button></td></tr>`).join('')}</tbody></table>`}
function mute(id){const i=INCIDENTS.find(x=>x.id==id);i.muted=!i.muted;toast(i.muted?id+' muted for 24 hours':id+' unmuted');render()}
function setStatus(id,s){INCIDENTS.find(x=>x.id==id).status=s;ui.menu=null;toast(id+' set to '+STL[s]+(s=='fp'?'. GenMeta will learn from this.':''));render()}
function bulk(kind){const ids=[...ui.sel];if(kind=='mute')ids.forEach(id=>INCIDENTS.find(x=>x.id==id).muted=true);if(kind=='own')ids.forEach(id=>INCIDENTS.find(x=>x.id==id).own='Madhavi');if(kind=='inv')ids.forEach(id=>INCIDENTS.find(x=>x.id==id).status='investigating');toast(ids.length+' incidents updated');ui.sel.clear();render()}
function vIncidentList(){const f=ui.ifilter;let rows=INCIDENTS.filter(i=>(f.status=='all'||(f.status=='open'?(i.status=='triage'||i.status=='investigating'):i.status==f.status))&&(f.kind=='all'||i.kind==f.kind)&&(!f.own||i.own==f.own));
 return head('Incidents','Every failed rule and every anomaly becomes an incident that someone owns.',`<button class="btn md" onclick="toast('Looked for data changes: 1 asset changed, checks queued')">${I.refresh}Check for data changes</button><button class="btn md primary" onclick="runChecks()">${I.play}Run checks now</button>`)+
 `<div class="note">${I.info}<div>Checks run on every scheduled harvest (15 minutes) and again the moment an asset’s data changes. <b>Last run ${ui.lastRun}: 6 checks, 3 failed, 8.4s.</b> Anomalies beyond the rules are flagged when a robust z-score is above 3.5, or the last three runs shift by more than 25%.</div></div>`+
 `<div class="card pad chart" style="margin-bottom:16px"><div style="display:flex;align-items:center"><h3 style="margin:0">Time to resolution</h3><span style="margin-left:auto">${ttrLegend()}</span></div>${ttrChart()}</div>`+
 `<div class="toolbar"><span class="seg2">${[['open','Open'],['triage','Triage'],['investigating','Investigating'],['resolved','Resolved'],['fp','False positive'],['all','All']].map(([k,l])=>`<button class="${f.status==k?'on':''}" onclick="ui.ifilter.status='${k}';render()">${l}</button>`).join('')}</span><span class="seg2">${['all','Rule','Anomaly'].map(k=>`<button class="${f.kind==k?'on':''}" onclick="ui.ifilter.kind='${k}';render()">${k=='all'?'Rules + anomalies':k+'s'}</button>`).join('')}</span>${f.own?`<span class="chip on" onclick="delete ui.ifilter.own;render()">Owner: ${f.own} ✕</span>`:'<span class="chip">Owner <small>All</small></span>'}<span class="chip">Priority <small>All</small></span><span class="views" style="margin-left:auto"><span class="tlink" onclick="toast('View saved')">Save as view</span></span></div>`+
 (ui.sel.size?`<div class="bulk"><b>${ui.sel.size} selected</b><span style="flex:1"></span><button class="btn sm" onclick="bulk('own')">Assign owner</button><button class="btn sm" onclick="bulk('inv')">Set to Investigating</button><button class="btn sm" onclick="bulk('mute')">Mute</button><button class="btn sm" onclick="ui.sel.clear();render()">Clear</button></div>`:'')+
 `<div class="card" style="overflow:auto">${incTable(rows)}</div>`}
function metricChart(i){const W=760,H=200,pl=40,pr=10,pt=12,pb=24,n=21;let s=`<svg viewBox="0 0 ${W} ${H}">`;const bw=(W-pl-pr)/(n-1);
 const base=i.dim=='timeliness'?20:i.dim=='uniqueness'?99:i.dim=='accuracy'?97:90;const vals=[...Array(n)].map((_,k)=>k>=n-i.n?base-(i.sev=='high'?40:20)-k%3*4:base+((k*7)%5)-2);
 const y=v=>pt+(H-pt-pb)*(1-v/110);
 s+=`<path d="M${pl},${y(base+6)} L${W-pr},${y(base+6)} L${W-pr},${y(base-8)} L${pl},${y(base-8)}Z" fill="#EDF4FF"/>`;
 [0,50,100].forEach(v=>s+=`<text x="${pl-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#8694AB">${v}</text><line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E3EAF3"/>`);
 s+=`<path d="M${vals.map((v,k)=>(pl+k*bw)+','+y(v)).join('L')}" fill="none" stroke="#4D8CFF" stroke-width="2"/>`;
 vals.forEach((v,k)=>{const bad=k>=n-i.n;s+=`<circle cx="${pl+k*bw}" cy="${y(v)}" r="${bad?4.5:2.5}" fill="${bad?'#0E2A57':'#fff'}" stroke="${bad?'#0E2A57':'#4D8CFF'}" stroke-width="1.5"><title>${bad?'Incident: ':''}${v}</title></circle>`});
 s+=`<text x="${W-pr}" y="${y(base+6)-4}" text-anchor="end" font-size="10" fill="#566A89">expected band</text>`;return s+'</svg>'}
function rootCause(i){const L=LINEAGE[i.asset]||{up:[],down:[]};const W=820,H=260;let s=`<svg viewBox="0 0 ${W} ${H}">`;
 const node=(x,y,n,st)=>{const c=st=='me'?'#0E2A57':st=='inc'?'#4D8CFF':'#C9D6E6';return `<g class="gnode"><rect x="${x}" y="${y}" width="200" height="44" rx="8" fill="${st=='me'?'#EDF4FF':'#fff'}" stroke="${c}" stroke-width="${st?2:1}"/><text x="${x+12}" y="${y+19}" font-size="11.5" font-family="JetBrains Mono" font-weight="600" fill="#0E2A57">${esc(n.length>24?n.slice(0,23)+'…':n)}</text><text x="${x+12}" y="${y+34}" font-size="10.5" fill="${st?'#4D8CFF':'#8694AB'}">${st=='me'?'this incident':st=='inc'?'incident in same window':'healthy'}</text></g>`};
 const cy=H/2-22;const pos=(arr,x)=>arr.map((a,k)=>[x,arr.length==1?cy:cy+(k-(arr.length-1)/2)*(arr.length==2?120:70),a]);
 const U=pos(L.up,20),D=pos(L.down,600);
 U.forEach(([x,y])=>s+=`<path d="M${x+200},${y+22} C${x+260},${y+22} ${250},${cy+22} 310,${cy+22}" fill="none" stroke="#C9D6E6" stroke-width="1.5"/>`);
 D.forEach(([x,y])=>s+=`<path d="M510,${cy+22} C560,${cy+22} ${x-50},${y+22} ${x},${y+22}" fill="none" stroke="#C9D6E6" stroke-width="1.5"/>`);
 U.forEach(([x,y,a])=>s+=node(x,y,a[0],a[1]));D.forEach(([x,y,a])=>s+=node(x,y,a[0],a[1]));s+=node(310,cy,i.asset,'me');
 if(!L.up.length)s+=`<text x="120" y="${cy+26}" text-anchor="middle" font-size="11" fill="#8694AB">no upstream assets</text>`;
 return s+'</svg>'}
function vIncident(){const i=INCIDENTS.find(x=>x.id==ui.inc);const r=RULES.find(x=>x.id==i.rule);const L=LINEAGE[i.asset]||{up:[],down:[]};
 const related=[...L.up.filter(u=>u[1]).map(u=>[u[0],'upstream']),...L.down.filter(u=>u[1]).map(u=>[u[0],'downstream'])];
 let body='';
 if(ui.itab=='overview')body=`<div class="pgrid"><div class="stack"><div class="card pad chart"><h3>${esc(r?r.check:i.title)} on ${esc(i.asset)}</h3><p class="sub">Measured value over the last 21 runs. Dark points are incidents.</p>${metricChart(i)}</div>
 <div class="card"><table class="tbl"><thead><tr><th>Measured</th><th>Expected</th><th>Severity</th><th>Status</th><th>Seen at</th><th></th></tr></thead><tbody>${[...Array(i.n)].map((_,k)=>`<tr style="cursor:default"><td class="mono" style="font-size:12px">${esc(i.measured)}</td><td class="mono" style="font-size:12px">${esc(i.expect)}</td><td>${sevB(i.sev)}</td><td>${stB(i.status)}</td><td class="muted">${k==0?i.last:i.first}</td><td><button class="btn sm" onclick="ui.modal='debug';draw()">${I.code}Debug</button></td></tr>`).join('')}</tbody></table></div></div>
 <div class="side"><div class="prop"><label>Status</label><div class="v">${stB(i.status,i.id)}</div></div><div class="prop"><label>Owner</label><div class="v">${person(i.own)}</div></div><div class="prop"><label>Priority</label><div class="v">${priB(i.pri)} <span class="faint" style="font-size:12px">from asset</span></div></div><div class="prop"><label>Found by</label><div class="v">${i.kind=='Anomaly'?'Anomaly detection':esc(r.name)} <span class="kd ${i.kind=='Anomaly'?'anom':''}">${i.kind}</span></div></div><div class="prop"><label>Dimension</label><div class="v">${DIML[i.dim]}</div></div><div class="prop"><label>First seen · last seen</label><div class="v">${i.first} · ${i.last}</div></div>${r&&r.why?`<div class="prop"><label>Why it matters</label><div class="v" style="font-weight:400">${esc(r.why)}</div></div>`:''}
 <div class="prop"><label>Activity</label><div class="hist"><div><span class="dot"></span><div>${i.n} incidents reported<small>${i.last}</small></div></div><div><span class="dot"></span><div>Alert sent to ${esc(i.own)} by email<small>${i.first}</small></div></div></div><div class="cmt"><input class="input" placeholder="Leave a comment"><button class="btn sm" onclick="toast('Comment added')">Post</button></div></div></div></div>`;
 if(ui.itab=='root')body=`<div class="card pad graph"><h3>Related incidents across lineage</h3><p class="sub">Upstream and downstream assets that had incidents in the same window. Lineage comes from the Graph.</p>${rootCause(i)}</div>
 <div class="card" style="margin-top:16px">${related.length?`<table class="tbl"><thead><tr><th>Asset</th><th>Relationship</th><th>What we found</th></tr></thead><tbody>${related.map(([a,rel])=>`<tr><td class="mono" style="font-size:12px;font-weight:600">${esc(a)}</td><td>${rel}</td><td class="muted">${rel=='upstream'?'An incident on an upstream source in the same window. Likely cause, fix this first.':'A downstream asset is now affected by this incident.'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No related incidents. This problem most likely started on this asset.</div>'}</div>`;
 if(ui.itab=='past')body=`<div class="card"><table class="tbl"><thead><tr><th>Incident</th><th>Status</th><th>First seen</th><th>Time to resolve</th></tr></thead><tbody><tr><td class="mono">INC-0981</td><td>${stB('resolved')}</td><td class="muted">12 Sep</td><td>14.2 h</td></tr><tr><td class="mono">INC-0902</td><td>${stB('fp')}</td><td class="muted">2 Sep</td><td>1.1 h</td></tr></tbody></table></div>`;
 return `<div class="crumbs" style="margin-bottom:10px"><span class="tlink" onclick="go('incidents',{mtab:'incidents'})">Monitoring & anomalies</span> / <b>${i.id}</b></div>
 <div class="thead"><div class="ticon">${I.alert}</div><div><h1>${esc(i.title)} ${sevB(i.sev)}</h1><div class="kind mono">${i.id} · ${esc(i.asset)}</div></div><div class="tools"><button class="btn md" onclick="mute('${i.id}')">${i.muted?I.mute+'Unmute':I.bell+'Mute'}</button><button class="btn md" onclick="ui.modal='debug';draw()">${I.code}Debug query</button><button class="btn md primary" onclick="setStatus('${i.id}','resolved')">Mark resolved</button></div></div>
 <div class="tabs">${[['overview','Overview'],['root','Root cause'],['past','Past incidents',2]].map(t=>`<button class="tab ${ui.itab==t[0]?'on':''}" onclick="ui.itab='${t[0]}';render()">${t[1]}${t[2]?` <small>${t[2]}</small>`:''}</button>`).join('')}</div>${body}`}
function debugModal(){const i=INCIDENTS.find(x=>x.id==ui.inc)||INCIDENTS[0];const col=(RULES.find(r=>r.id==i.rule)||{}).col||'*';
 const sql=i.dim=='uniqueness'?`SELECT ${col}, COUNT(*) AS copies\nFROM RPLUS_DWH.${i.asset}\nGROUP BY ${col}\nHAVING COUNT(*) > 1\nORDER BY copies DESC\nLIMIT 50;`:i.dim=='completeness'?`SELECT *\nFROM ${i.asset}\nWHERE ${col=='—'?'CUSTOMER_EMAIL':col} IS NULL\n   OR TRIM(${col=='—'?'CUSTOMER_EMAIL':col}) = ''\nLIMIT 50;`:`SELECT MAX(LAST_ALTERED) AS last_change,\n       DATEDIFF('hour', MAX(LAST_ALTERED), CURRENT_TIMESTAMP) AS hours_ago\nFROM INFORMATION_SCHEMA.TABLES\nWHERE TABLE_NAME = '${i.asset.split('.').pop()}';`;

 `<div class="card"><div style="padding:16px 18px 6px"><h3>Quality scorecards</h3></div><table class="tbl"><thead><tr><th>Asset</th><th>Type</th><th>Status</th><th>Score</th><th class="num">Columns</th><th>Measurement</th></tr></thead><tbody>${rows.map(a=>`<tr onclick="ui.side='${a.n}';draw()"><td class="mono" style="font-size:12.5px;font-weight:600">${a.n}</td><td class="muted">${a.t}</td><td>${statusB(a.score)}</td><td>${scoreB(a.score)}</td><td class="num">${(COLUMNS[a.n]||[1,2,3,4,5]).length}</td><td class="muted" style="font-size:12.5px">${a.m=='file'?'File read':ui.mode=='live'?'Live profile':'Metadata estimate'}</td></tr>`).join('')}</tbody></table></div>`}

 let body='';
 if(mt=='results')body=`<div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th>Status</th><th>Rule</th><th>Asset</th><th>Dimension</th><th>Measured</th><th>Threshold</th><th>Trigger</th><th>When</th></tr></thead><tbody>${RESULTS.map(r=>`<tr style="cursor:default"><td>${r[0]=='pass'?'<span class="badge b-approved"><i></i>Passed</span>':'<span class="badge b-draft" style="color:var(--navy);border-color:var(--navy)"><i style="background:var(--navy)"></i>Failed</span>'}</td><td class="tname">${esc(r[1])}</td><td class="mono" style="font-size:12px">${r[2]}</td><td><span class="tag">${DIML[r[3]]}</span></td><td class="mono" style="font-size:12px">${esc(r[4])}</td><td class="mono" style="font-size:12px">${esc(r[5])}</td><td><span class="kd">${r[6]}</span></td><td class="muted">${r[7]}</td></tr>`).join('')}</tbody></table></div><p class="foot">Latest result per rule and asset. Trigger shows what started the run: the 15-minute schedule, a data change, or a manual run.</p>`;
 if(mt=='alerts')body=`<div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th>Alert</th><th>Asset</th><th>Severity</th><th>Notified</th><th>Email</th><th>Status</th><th></th></tr></thead><tbody>${ALERTS.map(a=>`<tr onclick="go('incident',{inc:'${a.inc}',itab:'overview'})"><td><div class="tname">${esc(a.t)}</div><small class="faint mono">${a.id} · ${a.w}</small></td><td class="mono" style="font-size:12px">${a.a}</td><td>${sevB(a.sev)}</td><td style="font-size:12.5px">${esc(a.to)}<br><span class="faint">in-app + email</span></td><td><span class="kd ${/Bounced/.test(a.mail)?'anom':''}">${a.mail}</span></td><td><span class="st ${a.st=='resolved'?'st-resolved':a.st=='ack'?'st-investigating':'st-triage'}" style="cursor:default"><i></i>${ALS[a.st]}</span></td><td onclick="event.stopPropagation()" style="white-space:nowrap">${a.st=='open'?`<button class="btn sm" onclick="alertAct('${a.id}','ack')">Acknowledge</button> `:''}${a.st!='resolved'?`<button class="btn sm" onclick="alertAct('${a.id}','resolved')">Resolve</button>`:''}</td></tr>`).join('')}</tbody></table></div><p class="foot">Alerts go in-app and by email to the asset’s owner and steward. Extra channels such as Slack are set in Notification rules.</p>`;
 if(mt=='anomalies')body=`<div class="note">${I.info}<div><b>Anomalies beyond the rules.</b> GenMeta watches every profiled metric, so nothing here needs a rule written first. It flags a robust z-score above 3.5, a level shift of more than 25% over the last three runs, or a change from a value that has always been constant.</div></div><div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th>Asset</th><th>Metric</th><th>Now</th><th>Usual</th><th>How it was found</th><th class="num">Readings</th><th></th></tr></thead><tbody>${ANOMS.map((x,k)=>`<tr style="cursor:default"><td class="mono" style="font-size:12px;font-weight:600">${x.a}</td><td>${x.m}</td><td class="mono" style="font-weight:600">${x.now}</td><td class="mono muted">${x.usual}</td><td style="font-size:12.5px;max-width:300px">${esc(x.how)}</td><td class="num">${x.n}</td><td><button class="btn sm" onclick="ui.modal={kind:'explain',i:${k}};draw()">Explain</button></td></tr>`).join('')}</tbody></table></div>`;
 if(mt=='incidents'){const html=vIncidentList();body=html.slice(html.indexOf('<div class="toolbar">'))}
 return head('Monitoring & anomalies','Checks run on every scheduled harvest (15 minutes) and again the moment an asset’s data changes.',`<button class="btn md" onclick="toast('Looked for data changes: STG.ORDER_ITEM_SUMMARY changed, re-checked now')">${I.refresh}Check for data changes</button><button class="btn md primary" onclick="runChecks()">${I.play}Run checks now</button>`)+
 `<div class="tiles t4"><div><span>Last run</span><b style="font-size:17px">${ui.lastRun}</b><small>6 checks · 3 failed · 8.4s</small></div><div><span>Next scheduled run</span><b style="font-size:17px">in 11 min</b><small>every harvest · 15 min</small></div><div><span>Open alerts</span><b>${ALERTS.filter(a=>a.st=='open').length}</b><small>${ALERTS.filter(a=>a.st=='ack').length} acknowledged</small></div><div><span>Anomalies</span><b>${ANOMS.length}</b><small>found without a rule</small></div></div>`+
 `<div class="tabs">${tabs.map(t=>`<button class="tab ${mt==t[0]?'on':''}" onclick="ui.mtab='${t[0]}';render()">${t[1]} <small>${t[2]}</small></button>`).join('')}</div>`+body}
function draw(){let o='';if(ui.drawer)o+=ui.drawer.kind=='rule'?ruleDrawer():notifDrawer();if(ui.side)o+=sidePanel();if(ui.modal=='debug')o+=debugModal();if(ui.modal&&ui.modal.kind=='explain')o+=explainModal();if(ui.modal&&ui.modal.kind=='del')o+=delModal();if(ui.menu)o+=menuEl();if(ui.toast)o+=`<div class="toast">${esc(ui.toast)}</div>`;$('#overlay').innerHTML=o}
render();
</script></body></html>
