<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data products prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2A57;--deep:#07111F;--royal:#4D8CFF;--sky:#A9D3FF;--ice:#EDF4FF;--mist:#F6FBFF;--canvas:#F3F6FA;--line:#D7E1EC;--line2:#C9D6E6;--muted:#566A89;--faint:#8694AB;--white:#fff;
--r-ctl:8px;--r-card:12px;--shadow-1:0 1px 2px rgba(14,42,87,.06),0 1px 1px rgba(14,42,87,.04);--ring:0 0 0 2px #fff,0 0 0 4px var(--royal);--h-sm:28px;--h-md:32px;--h-lg:36px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 'Hanken Grotesk',system-ui,sans-serif;color:var(--navy);background:var(--canvas)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
/* chrome */
.top{position:fixed;inset:0 0 auto 0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 16px;z-index:20}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;width:220px}
.logo .rp{font-family:Georgia,serif;font-size:20px}
.logo .sep{width:1px;height:20px;background:var(--line2)}
.logo .gm{color:var(--navy)}.logo .gm i{font-style:normal;color:var(--royal)}
.crumbs{font-size:13px;color:var(--muted)}.crumbs b{color:var(--navy);font-weight:600}
.search{margin-left:auto;margin-right:auto;width:400px;height:34px;border-radius:var(--r-ctl);background:var(--canvas);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--faint);font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6FA6FF,#3F7BEA);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.rail{position:fixed;top:56px;bottom:0;left:0;width:56px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;z-index:10}
.rail a{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.rail a.on{background:var(--ice);color:var(--royal)}
.rail a:hover{background:var(--mist)}
.inner{position:fixed;top:56px;bottom:0;left:56px;width:268px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:9}
.inner-h{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.inner-b{overflow:auto;padding:10px 10px 24px;flex:1}
.main{margin-left:324px;padding:72px 32px 40px}
/* inner menu */
.msearch{height:32px;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:var(--r-ctl);padding:0 10px;margin-bottom:8px}
.msearch input{border:0;outline:0;flex:1;font-size:13px;background:transparent}
.mlink{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;cursor:pointer;font-size:13.5px;color:var(--navy);user-select:none}
.mlink:hover{background:var(--mist)}
.mlink.on{background:var(--ice);font-weight:600}
.mlink.on svg{color:var(--royal)}
.mlink .cnt{margin-left:auto;font-size:11.5px;color:var(--faint)}
.mlink .chev{width:14px;color:var(--faint);transition:transform .15s;flex:none}
.mlink .chev.open{transform:rotate(90deg)}
.tchild{padding-left:22px}
.tchild2{padding-left:40px}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.sec{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:14px 8px 6px;cursor:pointer}
.divider{height:1px;background:var(--line);margin:12px 4px}
.fbox{border:1px solid var(--line);border-radius:var(--r-ctl);padding:4px;margin:0 4px}
.chk{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px;font-size:13px;border-radius:5px;cursor:pointer}
.chk:hover{background:var(--mist)}
.chk input{accent-color:var(--royal)}
.chk .cnt{margin-left:auto;font-size:11.5px;color:var(--faint)}
/* shared */
.eyebrow{font:500 11px 'JetBrains Mono';letter-spacing:.14em;color:var(--royal);text-transform:uppercase}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.phead h1{margin:4px 0 4px;font-size:26px;font-weight:600;letter-spacing:-.01em}
.phead p{margin:0;color:var(--muted);font-size:13.5px}
.btn{height:var(--h-lg);padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--line2);background:#fff;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--mist);border-color:var(--muted)}
.btn:focus-visible,.mlink:focus-visible,.tab:focus-visible,.ib:focus-visible{outline:0;box-shadow:var(--ring)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--deep)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--ice)}
.btn.sm{height:var(--h-sm);padding:0 10px;font-size:12.5px}
.btn.md{height:var(--h-md);padding:0 12px;font-size:13px}
.btn:disabled{background:var(--ice);border-color:var(--line);color:var(--faint);cursor:not-allowed}
.ib{width:32px;height:32px;border-radius:var(--r-ctl);border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--ice);color:var(--navy)}
.ib.on{color:var(--royal)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1)}
.card.pad{padding:18px 20px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1);margin-bottom:16px}
.tiles>div{padding:14px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.tiles>div:first-child{border-left:0}
.tiles b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.tiles span{font-size:12.5px;font-weight:600}
.tiles small{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%}
.b-approved{background:var(--ice);color:var(--navy)}.b-approved i{background:var(--royal)}
.b-review{background:#fff;color:var(--royal);border:1px solid rgba(77,140,255,.55)}.b-review i{background:var(--royal)}
.b-draft{background:#F3F5F8;color:var(--muted);border:1px dashed var(--line2)}.b-draft i{background:var(--faint)}
.b-deprecated{background:#fff;color:var(--faint);border:1px solid var(--line)}.b-deprecated i{background:#fff;border:1.5px solid var(--faint)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--mist);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:#fff;font-size:12.5px;cursor:pointer}
.chip:hover{background:var(--mist)}
.chip.on{background:var(--ice);border-color:var(--royal)}
.chip small{color:var(--faint)}
.seg2{display:inline-flex;background:#fff;border:1px solid var(--line2);border-radius:var(--r-ctl);padding:2px;gap:2px}
.seg2 button{height:26px;border:0;background:transparent;border-radius:6px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg2 button:hover{background:var(--mist);color:var(--navy)}
.seg2 button.on{background:var(--ice);color:var(--navy)}
.input{height:var(--h-md);border:1px solid var(--line2);border-radius:var(--r-ctl);padding:0 10px;background:#fff;outline:0;font-size:13px}
.input:focus,textarea:focus{box-shadow:var(--ring);border-color:var(--royal)}
textarea.input{height:auto;padding:8px 10px;resize:vertical;min-height:72px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--mist)}
.tbl .tname{display:flex;align-items:center;gap:8px;font-weight:600}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.plist>div{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.plist>div:last-child{border-bottom:0}
.plist small{display:block;font-size:12px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin-top:10px}
.tlink{color:var(--royal);font-weight:500;cursor:pointer}
.tlink:hover{text-decoration:underline;text-underline-offset:3px}
/* term profile */
.thead{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.ticon{width:44px;height:44px;border-radius:10px;background:var(--ice);color:var(--royal);display:grid;place-items:center;flex:none}
.thead h1{margin:0;font-size:24px;font-weight:600;display:flex;align-items:center;gap:10px}
.thead .kind{font-size:12.5px;color:var(--muted);margin-top:2px}
.tools{margin-left:auto;display:flex;align-items:center;gap:2px}
.banner{display:flex;align-items:center;gap:10px;border:1px solid rgba(77,140,255,.35);background:var(--mist);border-radius:var(--r-ctl);padding:10px 14px;font-size:13px;margin-bottom:14px}
.banner .btn{margin-left:auto}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:16px;height:44px;align-items:flex-end}
.tab{height:44px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;cursor:pointer;padding:0}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--royal)}
.tab small{font-size:11.5px;background:var(--ice);border-radius:99px;padding:0 6px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.side{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:6px 18px 12px;position:sticky;top:72px}
.prop{padding:11px 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.prop .v{font-size:13.5px;font-weight:500;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.person{display:inline-flex;align-items:center;gap:6px}
.person i{width:20px;height:20px;border-radius:50%;background:var(--ice);color:var(--royal);font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center}
.cert{background:var(--ice);border-radius:var(--r-ctl);padding:8px 10px;font-size:12.5px}
.cert b{display:flex;align-items:center;gap:6px}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:4px 0}
.arow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow:hover{background:var(--mist)}
.aico{width:30px;height:30px;border-radius:8px;background:var(--ice);color:var(--royal);display:grid;place-items:center;flex:none}
.arow .an{font-family:'JetBrains Mono';font-size:12.5px;font-weight:500;color:var(--royal);cursor:pointer}
.arow .am{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-top:2px}
.arow .ib{margin-left:auto}
.hist>div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist>div:last-child{border-bottom:0}
.hist .dot{width:9px;height:9px;border-radius:50%;background:var(--royal);margin-top:5px;flex:none;box-shadow:0 0 0 3px var(--ice)}
.hist small{display:block;color:var(--muted);font-size:12px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.formgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.formgrid label,.fld label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.fld{margin-bottom:12px}
.fld .input{width:100%}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(7,17,31,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;z-index:41;box-shadow:-20px 0 40px -20px rgba(14,42,87,.3);display:flex;flex-direction:column}
.drawer header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.drawer .db{padding:18px 20px;overflow:auto;flex:1}
.drawer footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal{position:fixed;left:50%;top:30%;transform:translate(-50%,-30%);width:420px;background:#fff;border-radius:14px;z-index:41;padding:20px;box-shadow:0 20px 50px -20px rgba(14,42,87,.4)}
.modal h3{margin:0 0 6px;font-size:17px}
.menu{position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px -10px rgba(14,42,87,.3);padding:4px;min-width:200px;z-index:30}
.menu button{display:flex;width:100%;align-items:center;gap:8px;height:32px;border:0;background:none;border-radius:6px;padding:0 10px;font-size:13px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--mist)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 10px 30px -10px rgba(7,17,31,.5)}
.proto{position:fixed;left:340px;bottom:16px;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);box-shadow:var(--shadow-1)}
.graph svg{display:block;width:100%;height:auto}
.gnode{cursor:pointer}
.gnode:hover rect{stroke:var(--royal)}
/* ---- data products additions ---- */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:16px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative}
.pcard:hover{border-color:var(--royal)}
.pcard h4{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.pcard .desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.pcard .meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pcard .meta span{display:inline-flex;align-items:center;gap:4px}
.pcard .foot2{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.pcard .tip{display:none;position:absolute;left:18px;right:18px;top:70px;background:var(--navy);color:#fff;font-size:12.5px;padding:10px 12px;border-radius:8px;z-index:5;box-shadow:0 10px 30px -10px rgba(7,17,31,.5)}
.pcard .desc:hover + .tip{display:block}
.dchip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:500;background:var(--ice);color:var(--navy)}
.dchip i{width:8px;height:8px;border-radius:2px}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 6px;border-radius:6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.s-hi{background:#E6F0FF;color:#1E4FA8}.s-mid{background:#FFF4DE;color:#8A5A00}.s-lo{background:#FDEBEC;color:#9F2D2D}
.b-published{background:var(--ice);color:var(--navy)}.b-published i{background:var(--royal)}
.b-sunset{background:#FFF7EA;color:#8A5A00;border:1px solid #F1D9A8}.b-sunset i{background:#E3A008}
.b-archived{background:#fff;color:var(--faint);border:1px solid var(--line)}.b-archived i{background:#fff;border:1.5px solid var(--faint)}
.lvl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500}
.lvl i{width:8px;height:8px;border-radius:50%}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;background:var(--ice);border-radius:99px;overflow:hidden}
.bar>b{display:block;height:100%;background:var(--royal);border-radius:99px}
.bigscore{display:flex;align-items:baseline;gap:6px}
.bigscore b{font-size:34px;font-weight:700;letter-spacing:-.02em}
.enr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.enr>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.enr b{font-size:22px;font-weight:600}
.enr .rem{font-size:12px;color:var(--royal);cursor:pointer;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px}
.statgrid b{font-size:22px;font-weight:600;display:block}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--line);padding-top:8px}
.chart>div{flex:1;background:var(--sky);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart>div.hi{background:var(--royal)}
.chartx{display:flex;gap:6px;font-size:11px;color:var(--faint);margin-top:4px}.chartx span{flex:1;text-align:center}
.port{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.port:last-child{border-bottom:0}
.flow{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr;align-items:center;gap:0}
.flow .col{display:flex;flex-direction:column;gap:8px}
.flow .node{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#fff;font-size:12.5px}
.flow .node.p{background:var(--navy);color:#fff;border-color:var(--navy);text-align:center;padding:16px}
.flow .arr{height:2px;background:var(--line2);position:relative}
.flow .arr:after{content:'';position:absolute;right:-2px;top:-4px;border:5px solid transparent;border-left-color:var(--line2)}
.collapse h4{margin:0;font-size:13.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
.collapse .cb{padding:8px 0 4px 22px;display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13px}
.collapse .cb label{display:block;font-size:12px;color:var(--muted)}
.readme h2{font-size:18px;margin:0 0 8px}.readme p{margin:0 0 8px;font-size:13.5px;color:var(--navy)}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;height:4px;border-radius:99px;background:var(--ice)}
.steps span.on{background:var(--royal)}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--navy)}
.radio input{accent-color:var(--royal)}
.pick{border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto}
.pick label{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;font-family:'JetBrains Mono';cursor:pointer;color:var(--navy)}
.pick label small{margin-left:auto;font-family:'Hanken Grotesk';color:var(--faint)}

  const rq=REQS.filter(r=>r.p===p.id);
  body=`<div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="card pad"><h3>Visibility</h3><p class="sub">Who can find this product in the marketplace.</p>
   <div class="radio" id="vis">${['Public','Private to domain members','Private to selected members'].map(v=>`<label><input type="radio" name="vis" value="${v}" ${p.vis===v?'checked':''}>${v}</label>`).join('')}</div></div>
   <div class="card pad"><h3>Access requests</h3><p class="sub">The owner approves or declines.</p>${rq.map(r=>`<div class="cand"><div style="flex:1"><b>${esc(r.who)}</b><div class="muted" style="font-size:12px">${esc(r.why)} · ${r.t}</div></div><span class="tag">${r.st}</span></div>`).join('')||'<div class="muted" style="font-size:13px">No requests yet.</div>'}<button class="btn sm" style="margin-top:10px" id="reqa">${I.lock} Request access</button></div></div>`;
 } else {
  const h=ACT.filter(a=>a.p===p.id);
  body=`<div class="card pad"><h3>History</h3><p class="sub">Every status change and edit to this product.</p><div class="hist">${h.map(a=>`<div><span class="dot"></span><div>${esc(a.what)}<small>${a.t} · ${esc(a.who)}</small></div></div>`).join('')||'<div class="muted">No changes yet.</div>'}</div></div>`;
 }
 const st=PST[p.status];
 $('#main').innerHTML=`
  <div class="thead"><div class="ticon">${I.box}</div><div><h1>${esc(p.name)} ${badge(p.status)} ${p.cert==='Verified'?I.check:''}</h1><div class="kind">Data product · <span class="tlink" data-gd="${d.id}">${esc(d.name)}</span></div></div>
   <div class="tools" style="position:relative">
    <select class="input" id="stsel" style="width:130px;height:32px" title="Change status">${Object.keys(PST).map(k=>`<option value="${k}" ${p.status===k?'selected':''}>${PST[k][0]}</option>`).join('')}</select>
    <button class="ib ${ui.star.has(p.id)?'on':''}" id="star" title="Star">${ui.star.has(p.id)?I.starF:I.starL}</button><button class="ib" id="copy" title="Copy link">${I.link}</button><button class="ib" id="notify" title="Notify me">${I.bell}</button><button class="ib" id="more" title="More actions">${I.dots}</button>
    ${ui.menu?`<div class="menu"><button data-m="announce">${I.mega} Add announcement</button><button data-m="request">${I.lock} Request access</button><button data-m="export">Export assets</button><button data-m="archive">Archive product</button></div>`:''}
   </div></div>
  ${p.status==='draft'?`<div class="banner">${I.box}<span><b>Draft.</b> Only owners can see this product. Publish it to list it in the marketplace.</span><button class="btn primary sm" id="publish">Publish</button></div>`:''}
  ${p.announce?`<div class="annc">${I.mega}<span><b>Announcement.</b> ${esc(p.announce)}</span></div>`:''}
  <div class="tabs">${tabs.map(([k,l,n])=>`<button class="tab ${ui.tab===k?'on':''}" data-t="${k}">${l}${n!=null?` <small>${n}</small>`:''}</button>`).join('')}</div>
  <div class="pgrid"><div>${body}</div>
   <div class="side">
    <div class="prop"><label>Status</label><div class="v">${badge(p.status)}</div></div>
    <div class="prop"><label>Certificate</label><div class="v">${p.cert==='Verified'?'<div class="cert"><b>'+I.check+' Verified</b>by '+esc(p.owner)+'</div>':esc(p.cert)}</div></div>
    <div class="prop"><label>Owner</label><div class="v">${person(p.owner)}</div></div>
    <div class="prop"><label>Experts</label><div class="v">${p.experts.map(person).join(' ')||'<span class="faint">—</span>'}</div></div>
    <div class="prop"><label>Visibility</label><div class="v">${esc(p.vis)}</div></div>
    <div class="prop"><label>Criticality · Sensitivity</label><div class="v">${lvl(CRIT,p.crit)} ${lvl(SENS,p.sens)}</div></div>
    <div class="prop"><label>Glossary terms</label><div class="v">${p.terms.map(t=>`<span class="tlink">${esc(t)}</span>`).join(', ')||'<span class="faint">—</span>'}</div></div>
    <div class="prop"><label>Tags</label><div class="v">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<span class="faint">—</span>'}</div></div>
    <div class="prop"><label>Consumers</label><div class="v">${p.consumers}</div></div>
    <div class="prop"><label>Created</label><div class="v">${esc(p.created)}</div></div>
   </div></div>`;
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.t;render()});
 $('[data-gd]').onclick=()=>go({view:'domain',domain:d.id,tab:'overview'});
 $('#stsel').onchange=e=>setStatus(p,e.target.value);
 $('#star').onclick=()=>{ui.star.has(p.id)?ui.star.delete(p.id):ui.star.add(p.id);render()};
 $('#copy').onclick=()=>toast('Link copied');$('#notify').onclick=()=>toast('You will be notified of changes to '+p.name);
 $('#more').onclick=e=>{e.stopPropagation();ui.menu=!ui.menu;render()};
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ui.menu=false;const m=b.dataset.m;if(m==='announce')announce(p);else if(m==='request')requestAccess(p);else if(m==='export')toast('Exported '+p.assets.length+' assets');else setStatus(p,'archived')});
 if($('#publish'))$('#publish').onclick=()=>setStatus(p,'published');
 if($('#whys'))$('#whys').onclick=()=>{const w=$('#whyd');w.style.display=w.style.display==='none'?'':'none'};
 if($('#aird'))$('#aird').onclick=()=>{p.readme=`${p.name} is the ${d.name} domain's product for ${p.desc.charAt(0).toLowerCase()+p.desc.slice(1)} Use the output port ${p.outputs[0]} for reporting. It is built from ${p.sources} source systems and refreshed ${p.sla?p.sla.fresh[0].toLowerCase():'on demand'}. Contact ${p.owner} for access.`;render();toast('AI draft added to the readme')};
 if($('#addport'))$('#addport').onclick=()=>{const c=p.assets.find(a=>!p.outputs.includes(a));if(c){p.outputs.push(c);log(p,'Output port '+c+' added');render()}else toast('All assets are already output ports')};
 document.querySelectorAll('[data-rmport]').forEach(b=>b.onclick=()=>{if(p.outputs.length<2)return toast('A product needs at least one output port');const a=p.outputs.splice(+b.dataset.rmport,1)[0];log(p,'Output port '+a+' removed');render()});
 if($('#addres'))$('#addres').onclick=()=>toast('Add a link, document or channel');
 if($('#addas'))$('#addas').onclick=()=>openNew({edit:p.id,step:1});
 if($('#setsla'))$('#setsla').onclick=()=>toast('Publish the product first');
 if($('#reqa'))$('#reqa').onclick=()=>requestAccess(p);
 document.querySelectorAll('#vis input').forEach(r=>r.onchange=()=>{p.vis=r.value;log(p,'Visibility set to '+r.value);render()});
 if(ui.tab==='lineage')bindCards();
}
function log(p,what){ACT.unshift({p:p.id,what,t:now(),who:'Admin'})}
function setStatus(p,s){if(p.status===s)return;const o=p.status;p.status=s;log(p,`Status ${o} → ${s}`);toast(`${p.name} is now ${PST[s][0].toLowerCase()}`);render()}
function modal(html,bind){$('#overlay').innerHTML=`<div class="scrim" id="scrim"></div><div class="modal">${html}</div>`;$('#scrim').onclick=close;bind&&bind()}
function close(){$('#overlay').innerHTML='';ui.drawer=null}
function announce(p){modal(`<h3>Add announcement</h3><p class="muted" style="font-size:13px;margin:0 0 10px">Shown at the top of the product for every consumer.</p><textarea class="input" id="an" style="width:100%" placeholder="e.g. Schema change on 1 Nov">${esc(p.announce||'')}</textarea><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn" id="c">Cancel</button><button class="btn primary" id="s">Post</button></div>`,()=>{$('#c').onclick=close;$('#s').onclick=()=>{p.announce=$('#an').value.trim();log(p,'Announcement updated');close();render()}})}
function requestAccess(p){modal(`<h3>Request access to ${esc(p.name)}</h3><p class="muted" style="font-size:13px;margin:0 0 10px">${esc(p.owner)} (owner) will be asked to approve.</p><div class="fld"><label>Why do you need it?</label><textarea class="input" id="why" style="width:100%"></textarea></div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" id="c">Cancel</button><button class="btn primary" id="s">Send request</button></div>`,()=>{$('#c').onclick=close;$('#s').onclick=()=>{REQS.push({p:p.id,who:'Admin',why:$('#why').value||'Not given',t:new Date().toLocaleDateString('en-GB'),st:'pending'});log(p,'Access requested by Admin');close();toast('Request sent to '+p.owner);render()}})}
/* ---------------- New product drawer: Details → Assets → Output ports → Review (Atlan flow) */
let NP=null;
function openNew(pre={}){
 if(pre.edit){const p=PR(pre.edit);NP={edit:p.id,step:1,name:p.name,desc:p.desc,domain:p.domain,crit:p.crit,sens:p.sens,owner:p.owner,vis:p.vis,assets:p.assets.slice(),outputs:p.outputs.slice()}}
 else NP=Object.assign({step:0,name:'',desc:'',domain:pre.domain||'customer',crit:'medium',sens:'internal',owner:'Admin',vis:'Private to domain members',assets:[],outputs:[]},pre);
 drawNew();
}
function drawNew(){
 const st=NP.step, labels=['Details','Assets','Output ports','Review'];
 let b='';
 if(st===0)b=`<div class="fld"><label>Name <span class="faint">(${NP.name.length}/80)</span></label><input class="input" id="n" maxlength="80" value="${esc(NP.name)}" placeholder="e.g. Customer 360"></div>
  <div class="fld"><label>Description</label><textarea class="input" id="ds" style="width:100%">${esc(NP.desc)}</textarea></div>
  <div class="fld"><label>Domain or sub-domain</label><select class="input" id="dm" style="width:100%">${DOMAINS.map(d=>`<option value="${d.id}" ${NP.domain===d.id?'selected':''}>${d.parent?'— ':''}${esc(d.name)}</option>`).join('')}</select></div>
  <div class="fld"><label>Criticality</label><div class="radio">${Object.keys(CRIT).map(k=>`<label><input type="radio" name="cr" value="${k}" ${NP.crit===k?'checked':''}>${CRIT[k][0]}</label>`).join('')}</div></div>
  <div class="fld"><label>Sensitivity</label><div class="radio">${Object.keys(SENS).map(k=>`<label><input type="radio" name="se" value="${k}" ${NP.sens===k?'checked':''}>${SENS[k][0]}</label>`).join('')}</div></div>
  <div class="fld"><label>Owner</label><input class="input" id="ow" value="${esc(NP.owner)}"></div>
  <div class="fld"><label>Visibility</label><select class="input" id="vi" style="width:100%">${['Private to domain members','Private to selected members','Public'].map(v=>`<option ${NP.vis===v?'selected':''}>${v}</option>`).join('')}</select></div>`;
 if(st===1)b=`<p class="muted" style="font-size:13px;margin:0 0 10px">Pick the assets that make up this product. <b id="selc">${NP.assets.length}</b> selected.</p><div class="pick">${Object.keys(ASSET).map(a=>`<label><input type="checkbox" data-a="${esc(a)}" ${NP.assets.includes(a)?'checked':''}>${esc(a)}<small>${ASSET[a][1]} · ${esc(ASSET[a][0])}</small></label>`).join('')}</div><p class="muted" style="font-size:12px;margin-top:10px">Tip: in the full build, assets can also be added by rules (connection, type, certificate, tags, terms).</p>`;
 if(st===2)b=NP.assets.length?`<p class="muted" style="font-size:13px;margin:0 0 10px">Which assets should consumers use? These become the output ports.</p><div class="pick">${NP.assets.map(a=>`<label><input type="checkbox" data-o="${esc(a)}" ${NP.outputs.includes(a)?'checked':''}>${esc(a)}<small>${ainfo(a).type}</small></label>`).join('')}</div>`:'<div class="empty">Add at least one asset first.</div>';
 if(st===3)b=`<dl class="kv"><dt>Name</dt><dd>${esc(NP.name)||'<span class="warn">Missing</span>'}</dd><dt>Domain</dt><dd>${dchip(NP.domain)}</dd><dt>Criticality</dt><dd>${lvl(CRIT,NP.crit)}</dd><dt>Sensitivity</dt><dd>${lvl(SENS,NP.sens)}</dd><dt>Owner</dt><dd>${person(NP.owner)}</dd><dt>Visibility</dt><dd>${esc(NP.vis)}</dd><dt>Assets</dt><dd>${NP.assets.length}</dd><dt>Output ports</dt><dd>${NP.outputs.map(esc).join(', ')||'<span class="warn">None</span>'}</dd></dl><p class="muted" style="font-size:12.5px;margin-top:14px">Save as draft keeps it visible to owners only. Create and publish lists it in the marketplace.</p>`;
 $('#overlay').innerHTML=`<div class="scrim" id="scrim"></div><div class="drawer"><header>${NP.edit?'Edit product assets':'New data product'}<button class="ib" id="cx">${I.x}</button></header>
  <div class="db"><div class="steps">${labels.map((l,i)=>`<span class="${i<=st?'on':''}"></span>`).join('')}</div><div style="font-size:12px;color:var(--muted);margin:-8px 0 14px">Step ${st+1} of 4 · <b style="color:var(--navy)">${labels[st]}</b></div>${b}</div>
  <footer>${st>0?'<button class="btn" id="bk">Back</button>':'<button class="btn" id="cn">Cancel</button>'}<span style="flex:1"></span>${st<3?'<button class="btn primary" id="nx">Next</button>':`<button class="btn" id="dr">Save as draft</button><button class="btn primary" id="pb">Create and publish</button>`}</footer></div>`;
 const save=()=>{if(st===0){NP.name=$('#n').value.trim();NP.desc=$('#ds').value.trim();NP.domain=$('#dm').value;NP.crit=document.querySelector('[name=cr]:checked').value;NP.sens=document.querySelector('[name=se]:checked').value;NP.owner=$('#ow').value.trim();NP.vis=$('#vi').value}
  if(st===1)NP.assets=[...document.querySelectorAll('[data-a]:checked')].map(x=>x.dataset.a);
  if(st===2){NP.outputs=[...document.querySelectorAll('[data-o]:checked')].map(x=>x.dataset.o);}
  NP.outputs=NP.outputs.filter(a=>NP.assets.includes(a))};
 $('#scrim').onclick=close;$('#cx').onclick=close;if($('#cn'))$('#cn').onclick=close;
 document.querySelectorAll('[data-a]').forEach(x=>x.onchange=()=>{$('#selc').textContent=document.querySelectorAll('[data-a]:checked').length});
 if($('#n'))$('#n').oninput=e=>{e.target.previousElementSibling.querySelector('span').textContent=`(${e.target.value.length}/80)`};
 if($('#bk'))$('#bk').onclick=()=>{save();NP.step--;drawNew()};
 if($('#nx'))$('#nx').onclick=()=>{save();if(st===0&&!NP.name)return toast('Give the product a name');if(st===2&&!NP.outputs.length)return toast('Pick at least one output port');NP.step++;drawNew()};
 const finish=status=>{if(!NP.name||!NP.outputs.length)return toast('Name and an output port are needed');
  if(NP.edit){const p=PR(NP.edit);p.assets=NP.assets;p.outputs=NP.outputs;log(p,'Assets updated');close();render();return}
  const id=NP.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(PR(id))return toast('A product with this name already exists');
  P.push({id,name:NP.name,owner:NP.owner,domain:NP.domain,desc:NP.desc||'No description yet.',consumers:0,sources:new Set(NP.assets.map(a=>ainfo(a).src)).size,quality:70,status,crit:NP.crit,sens:NP.sens,vis:NP.vis,cert:'Draft',terms:[],tags:[],experts:[],inputs:NP.assets.filter(a=>!NP.outputs.includes(a)),outputs:NP.outputs,assets:NP.assets,sc:[1,NP.desc?3:1,NP.owner?5:0,2,2,1],created:'Oct 2026',fresh:'just now',sla:null,users:[0,0,0,0,0,0]});
  ACT.unshift({p:id,what:status==='draft'?'Created as draft':'Created and published',t:now(),who:'Admin'});
  close();go({view:'product',product:id,tab:'overview'});toast(status==='draft'?'Saved as draft':'Published to the marketplace')};
 if($('#dr'))$('#dr').onclick=()=>finish('draft');if($('#pb'))$('#pb').onclick=()=>finish('published');
}
/* ---------------- router */
function render(){renderMenu();if(ui.view==='home')renderHome();else if(ui.view==='domain')renderDomain();else renderProduct()}
document.addEventListener('click',e=>{if(ui.menu&&!e.target.closest('.menu')&&!e.target.closest('#more')){ui.menu=false;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').innerHTML)close();if(e.key==='Enter'&&e.target.matches('.mlink,.pcard'))e.target.click()});
render();
</script>
</body>
</html>
