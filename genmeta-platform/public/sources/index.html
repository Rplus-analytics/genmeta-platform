<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GenMeta Data Sources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  /* GenMeta palette: navy + burst blues, same as src/styles.css + src/pro.css */
  --bg:#F5F7FA; --panel:#ffffff; --panel-2:#F6F9FD; --line:#E3E8F0; --line-2:#EEF2F7;
  --ink:#0B1A4A; --ink-2:#5F6B85; --ink-3:#8A95AB; --deep:#14307A;
  --blue:#1F5FD6; --blue-2:#38C6F4; --blue-soft:#EAF2FE; --sel:#EAF2FE;
  --warn:#1F5FD6; --bad:#0B1A4A;
  --shadow:0 1px 2px rgba(11,26,74,.04),0 1px 1px rgba(11,26,74,.03);
  --sans:"Hanken Grotesk",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.app{min-height:100%}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.logo-row{display:flex;align-items:center;gap:10px;padding:20px 20px 14px}
.logo-row .r{font-weight:700;font-size:22px;color:var(--ink);letter-spacing:-.04em}
.logo-row .sep{width:1px;height:22px;background:var(--line)}
.logo-row .gm{display:flex;align-items:center;gap:5px;font-size:15px;color:var(--ink-2)}
.logo-row svg{width:20px;height:20px;color:var(--blue)}
.product{padding:6px 20px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.product b{font-size:19px;font-weight:600}
.product span{display:block;font-size:13.5px;color:var(--ink-2)}
.navgroup{padding:14px 12px 0;display:flex;flex-direction:column;gap:2px}
.navgroup h6{margin:4px 10px 6px;font-size:13px;font-weight:500;color:var(--ink-3)}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;border:0;background:none;text-align:left;width:100%;color:var(--ink)}
.nav:hover{background:var(--panel-2)}
.nav.on{background:var(--sel);font-weight:500}
.nav svg{width:19px;height:19px;color:var(--ink-3);flex:none}
.nav.on svg{color:var(--blue)}
.nav .count{margin-left:auto;font-size:12px;background:var(--ink);color:var(--panel);border-radius:10px;padding:1px 8px}
.env{margin-top:auto;border-top:1px solid var(--line);padding:16px 20px;display:flex;gap:10px;align-items:flex-start}
.env .dot{width:8px;height:8px;border-radius:50%;background:var(--blue-2);margin-top:7px}
.env b{display:block;font-weight:500}.env span{font-size:13.5px;color:var(--ink-2)}
/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.crumb{font-size:14.5px;color:var(--ink-2);white-space:nowrap}
.crumb b{color:var(--ink);font-weight:500}
.crumb button{border:0;background:none;padding:0;color:var(--ink-2)}
.gsearch{flex:1;max-width:660px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.gsearch input{border:0;outline:0;background:none;width:100%}
.gsearch svg{width:17px;height:17px;color:var(--ink-3)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink-3);background:var(--panel)}
.ticons{display:flex;gap:14px;align-items:center}
.ticons svg{width:20px;height:20px;color:var(--ink-2)}
.ticons .bell{position:relative}.ticons .bell::after{content:"";position:absolute;top:0;right:0;width:7px;height:7px;border-radius:50%;background:var(--blue-2)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;display:grid;place-items:center;font-weight:600}
.iconbtn{border:0;background:none;padding:4px;display:grid;place-items:center}
/* main */
.main{padding-block:22px 64px;padding-inline:32px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em}
.phead p{margin:2px 0 0;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 11px;font-size:14px}
.btn.ghost{border-color:transparent;background:none}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:280px;z-index:10}
.menu button{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:10px;border-radius:8px}
.menu button:hover{background:var(--panel-2)}
.menu svg{width:18px;height:18px;color:var(--blue);flex:none;margin-top:2px}
.menu b{display:block;font-weight:500}.menu span{font-size:13px;color:var(--ink-3)}
.tabs{margin-top:18px;display:flex;gap:26px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 0;display:flex;gap:8px;align-items:center;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button svg{width:17px;height:17px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:500}
.tabs .badge{font-size:12px;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:0 7px}
/* collection strip */
.collect{margin-top:16px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.collect svg{width:18px;height:18px;color:var(--blue)}
.collect .it{display:flex;align-items:center;gap:6px}
.collect .it b{color:var(--ink);font-weight:500}
.collect .last{flex-basis:100%;padding-left:28px;color:var(--ink-3)}
.collect .rerun{margin-left:auto}
/* KPIs */
.kpis{margin-top:16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{display:flex;gap:14px;padding:18px 20px;border:0;border-right:1px solid var(--line-2);background:none;text-align:left;align-items:flex-start}
.kpi:last-child{border-right:0}
button.kpi:hover{background:var(--panel-2)}
.kpi.on{background:var(--blue-soft)}
.kic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--blue)}
.kic svg{width:20px;height:20px}
.kpi .n{font-size:30px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:15px}
.kpi .s{font-size:13.5px;color:var(--ink-3)}
/* attention */
.attn{margin-top:14px;display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--panel);border-radius:12px;padding:12px 16px;flex-wrap:wrap}
.attn .grow{flex:1;min-width:240px}
.attn b{font-weight:500}
.ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--warn);flex:none;display:inline-block}
/* filters */
.filters{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;flex:1;min-width:220px;max-width:360px}
.search input{border:0;outline:0;background:none;width:100%}
.search svg{width:17px;height:17px;color:var(--ink-3)}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.legend{display:flex;gap:16px;margin-left:auto;align-items:center;font-size:14.5px;flex-wrap:wrap}
.legend button{border:0;background:none;display:flex;gap:7px;align-items:center;padding:4px 2px;border-bottom:2px solid transparent}
.legend button.on{border-bottom-color:var(--ink)}
.mk{display:inline-block;flex:none}
.mk.healthy{width:9px;height:9px;border-radius:50%;background:var(--blue-2)}
.mk.warning{width:11px;height:11px;border-radius:50%;border:2px solid var(--warn)}
.mk.failed{width:9px;height:9px;background:var(--bad)}
.mk.scanning{width:9px;height:9px;border-radius:50%;background:var(--blue-2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.view{display:flex;gap:4px}
.view button{border:0;background:none;padding:6px;border-bottom:2px solid transparent;color:var(--ink-3)}
.view button.on{color:var(--ink);border-bottom-color:var(--ink)}
.view svg{width:19px;height:19px}
/* cards */
.grid{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px 0;display:flex;flex-direction:column;box-shadow:var(--shadow);cursor:pointer}
.card:hover{border-color:var(--blue-2)}
.chead{display:flex;gap:14px;align-items:flex-start}
.tile{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500;flex:none;background:var(--panel)}
.chead .nm{flex:1;min-width:0}
.chead .nm .conn{font-size:13.5px}
.chead b{display:block;font-size:19px;font-weight:500;line-height:1.25}
.chead span{color:var(--ink-2);font-size:14.5px}
.conn{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:14.5px;white-space:nowrap;margin-top:4px}
.conn .mk{background:var(--blue-2)}
.conn.off{color:var(--ink-3)}
.kebab{border:0;background:none;padding:4px;color:var(--ink-3);margin-top:0}
.kebab svg{width:18px;height:18px}
.desc{margin:14px 0 0;color:var(--ink)}
.schemas{margin-top:10px}
.schemas summary{color:var(--blue);cursor:pointer;list-style:none;display:inline-flex;gap:6px;align-items:center;font-size:15px}
.schemas summary::-webkit-details-marker{display:none}
.schemas summary::before{content:"";border:4px solid transparent;border-left:5px solid currentColor;margin-right:-2px;transition:transform .15s}
.schemas[open] summary::before{transform:rotate(90deg) translateX(2px)}
.schemas ul{list-style:none;margin:8px 0 0;padding:8px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel-2);font-size:13.5px;display:grid;gap:4px}
.schemas li{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px}
.schemas li span{font-family:var(--sans);color:var(--ink-3)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:14px;color:var(--ink-2);white-space:nowrap;background:var(--panel)}
.chip svg{width:14px;height:14px}
.chip.sens{border-color:var(--ink);color:var(--ink);font-weight:500;letter-spacing:.02em}
.tagrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.spark{display:flex;align-items:flex-end;gap:3px;height:38px;flex:none}
.spark i{display:block;width:4px;border-radius:2px;background:var(--blue-2);opacity:.85}
.spark i.w{background:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;padding:16px 0;border-top:1px solid var(--line-2)}
.stat{display:flex;gap:8px;align-items:flex-start}
.stat svg{width:18px;height:18px;color:var(--ink-3);margin-top:3px;flex:none}
.stat b{display:block;font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.countrow{padding:0 0 12px}
.stat span{font-size:13.5px;color:var(--ink-3)}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.owners{display:flex;align-items:center;gap:8px;font-size:14.5px}
.av{width:28px;height:28px;border-radius:50%;background:var(--sel);color:var(--blue);font-size:11.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--panel)}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.counts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cnt{display:inline-flex;gap:4px;align-items:center;font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:7px;padding:1px 7px;font-variant-numeric:tabular-nums}
.cnt svg{width:13px;height:13px}
.health{display:inline-flex;gap:6px;align-items:center;font-size:14.5px;font-weight:500;white-space:nowrap}
.cov{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--ink-3)}
.bar{flex:1;height:5px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue-2);border-radius:4px}
/* list */
.tablewrap{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1100px}
th{font-size:13px;font-weight:500;color:var(--ink-3);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:14.5px}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--panel-2)}
tr:last-child td{border-bottom:0}
.srccell{display:flex;gap:12px;align-items:center;min-width:220px}
.srccell .tile{width:36px;height:36px;font-size:11px}
.srccell b{display:block;font-weight:500}.srccell span{font-size:13px;color:var(--ink-3)}
.sub{font-size:13px;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
/* detail */
.dhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:6px}
.dhead .chead{align-items:center}
.dhead .tile{width:56px;height:56px;font-size:14px}
.dhead h1{margin:0;font-size:26px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{margin-top:18px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel)}
.banner.healthy{border-left:3px solid var(--blue-2)}.banner.warning{border-left:3px solid var(--warn)}.banner.failed{border-left:3px solid var(--bad)}
.banner .grow{flex:1}.banner b{display:block;font-weight:500}.banner p{margin:2px 0 0;color:var(--ink-2)}
.hint{margin-top:8px;font-size:14px;background:var(--panel-2);border-radius:8px;padding:8px 10px}
.dtabs{margin-top:18px}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.box h3{margin:0;font-size:17px;font-weight:500}
.box .cap{margin:2px 0 14px;color:var(--ink-3);font-size:13.5px}
.dk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dk div{padding:14px 18px;border-right:1px solid var(--line-2)}.dk div:last-child{border-right:0}
.dk b{display:block;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}.dk span{font-size:13.5px;color:var(--ink-3)}
.chart{position:relative}.chart svg{width:100%;height:auto;display:block}
.axis{fill:var(--ink-3);font-size:10px;font-family:var(--sans)}
.gl{stroke:var(--line-2)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:180px;transform:translate(-50%,-100%);box-shadow:var(--shadow)}
.tip .st{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.lg{display:flex;gap:16px;font-size:13px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.covrow{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2);font-size:14px}
.feed li:first-child{border-top:0}
.op{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.op.add{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.op.del{color:var(--ink);border-color:var(--ink)}
.op.chg{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.mono{font-family:var(--mono);font-size:13px}
.stages{display:flex;gap:2px;height:8px;width:170px;border-radius:4px;overflow:hidden;margin-top:4px}
.stages i{display:block;height:100%}
.errbox{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px;background:var(--panel-2)}
.tree{list-style:none;margin:0;padding:0}.tree ul{list-style:none;margin:0;padding-left:22px}
.tree label{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14.5px;cursor:pointer}
.tree .sub{margin-left:auto}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13.5px;color:var(--ink-2);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;width:100%}
.toggle{display:flex;align-items:center;gap:10px;font-size:14.5px;padding:6px 0;cursor:pointer}
.sw{width:36px;height:21px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
input.swi{position:absolute;opacity:0;width:1px;height:1px}
input.swi:checked+.sw{background:var(--blue)}
input.swi:checked+.sw::after{left:17px}
input.swi:focus-visible+.sw{outline:2px solid var(--blue);outline-offset:2px}
.diff{margin-top:6px;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.diff div{padding:3px 10px}.diff .m{background:var(--panel-2);color:var(--ink-3);text-decoration:line-through}.diff .p{background:var(--blue-soft);color:var(--blue)}
/* connectors tab */
.gal{display:grid;grid-template-columns:190px 1fr;gap:22px;margin-top:20px}
.cats{display:flex;flex-direction:column;gap:2px}
.cats button{border:0;background:none;text-align:left;padding:8px 12px;border-radius:9px;display:flex;justify-content:space-between;color:var(--ink-2)}
.cats button.on{background:var(--sel);color:var(--ink);font-weight:500}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
.ctile{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:10px;text-align:left}
.ctile:hover{border-color:var(--blue-2)}
.ctile.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.ctile .t{display:flex;gap:10px;align-items:center}
.ctile b{font-weight:500}.ctile span{font-size:13px;color:var(--ink-3)}

/* ===== GenMeta platform layer: matches the app shell it is embedded in ===== */
body{color:var(--ink);background:var(--bg)}
.main{max-width:1400px;margin:0 auto;padding:36px 48px 64px}
.crumb{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:13.5px;color:var(--ink-3)}
.crumb button{border:0;background:none;padding:0;color:var(--blue);font:inherit}
.crumb button:hover{text-decoration:underline}
.crumb b{color:var(--ink);font-weight:500}
.pg-eyebrow{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.phead h1,.dh-t h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.phead p{margin-top:8px;font-size:14px;color:var(--ink-2)}
.btn.primary{background:var(--ink);border-color:var(--ink)}
.btn.primary:hover{background:var(--deep);border-color:var(--deep);filter:none}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue)}
.tabs .badge{background:var(--blue-soft);color:var(--blue)}
.bar i,.covrow .bar i{background:linear-gradient(90deg,var(--blue),var(--blue-2))}
/* status, as in the platform: healthy = sky dot, warning = royal ring, failed = navy square */
.mk.warning{border-width:1.5px}
.bdg.healthy{background:var(--blue-soft);color:var(--ink)}
.bdg.healthy::before{background:var(--blue-2)}
.bdg.warning{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 40%,transparent)}
.bdg.warning::before{background:transparent;border:1.5px solid currentColor;width:5px;height:5px}
.bdg.failed{background:var(--ink);color:#fff}
.bdg.failed::before{border-radius:1px;background:#fff}
.alert,.attn{border-left-color:var(--blue)}
.alert.failed{border-left-color:var(--ink)}
.alert .ai svg{color:var(--blue)}
.spark i{background:var(--blue-2);opacity:1}
.spark i.w{background:var(--blue)}
.fresh.late,.late-t{color:var(--blue);font-weight:500}
.fresh.late{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 40%,transparent)}
.star.on{color:var(--blue)}
.avatar{background:var(--ink)}
.av{background:var(--blue-soft);color:var(--ink)}
.toast,.bulk,.tip{background:var(--ink)}
@media (max-width:860px){.main{padding:24px 16px 48px}}

function scan(id){const s=sources.find(x=>x.id===id),prev=s.status;s.status="scanning";render();toast(`Scan started for ${s.name}`);

function openDetail(id){state.view="detail";state.detail=id;state.dtab="status";render();window.scrollTo(0,0)}
function events(s,R){const ev=[];[...R].reverse().slice(0,8).forEach((r,k)=>{const t=k===0?s.last:(k*freqMin(s.freq)+mins(s.last))+" min ago";
  if(r.st!=="ok"&&s.status==="warning")ev.push(["warning",t,"Scan completed with warnings: archive/ skipped (AccessDenied 403 on 212 objects)"]);
  else ev.push(["sync",t,`Scan completed in ${Math.round(r.tot)}s · ${pl(r.changed,"objects")} changed`]);
  if(k===2&&s.drift[0])ev.push(["schema",t,`Schema change detected: ${s.drift[0][1]} (${s.drift[0][2]})`]);});
  ev.push(["action","3 days ago",`${s.owners[0]} changed scan frequency from Hourly to Every ${s.freq}`]);return ev}

function openContract(){
  const code=`class SourceConnector(Protocol):
    """Every connector implements this interface. Catalogue, lineage and
    classification all read metadata through it and nothing else."""

    info: ConnectorInfo

    def test_connection(self) -> list[ConnectionCheck]: ...
    def list_tables(self, scope: Scope) -> Iterator[TableRef]: ...
    def describe_table(self, table: TableRef) -> list[ColumnDef]: ...
    def signature(self, scope: Scope) -> str: ...
    def lineage(self, table: TableRef) -> list[LineageEdge]: ...   # optional`;
  const types=`@dataclass(frozen=True)
class ConnectorInfo:
    name: str                 # "snowflake"
    category: str             # Warehouse | Lakehouse | Data lake | Database | BI | SaaS/API | Streaming
    environment: str          # Multi-cloud | Cloud (AWS) | On-premises/hybrid | Third-party SaaS ...
    extraction_method: str    # Agentless | Agent | API | API/manifest

@dataclass(frozen=True)
class TableRef:
    source: str
    database: str | None
    schema: str | None
    name: str
    kind: str                 # table | view | file | topic | report

@dataclass(frozen=True)
class ColumnDef:
    name: str
    data_type: str
    nullable: bool
    is_key: bool = False
    partition: bool = False`;
  const ex=`class PostgresConnector(SourceConnector):
    info = ConnectorInfo("postgresql", "Database", "On-premises/hybrid", "Agentless")

    def list_tables(self, scope):
        for row in self.query("select table_schema, table_name, table_type "
                              "from information_schema.tables"):
            yield TableRef("postgresql", self.db, row[0], row[1],
                           "view" if row[2] == "VIEW" else "table")

    def describe_table(self, t):
        return [ColumnDef(c.name, c.type, c.nullable, c.name in self.pk(t))
                for c in self.columns(t)]

    def signature(self, scope):

 ["ALTR","Connector","Package to ingest classifications metadata from ALTR"],
 ["Amazon DynamoDB Assets","Connector",crawl("Amazon DynamoDB")],
 ["Amazon MSK Assets","Connector","Package to crawl Apache Kafka Assets and publish to GenMeta for discovery"],
 ["Amazon MWAA Airflow Assets","Orchestrator",ol("Amazon MWAA Airflow")],
 ["Anaplan","Connector",crawl("Anaplan")],
 ["Anomalo","Connector","Package to ingest metadata from Anomalo to enable consumption of data quality metadata."],
 ["Apache Iceberg","Connector",crawl("Apache Iceberg")],
 ["Apache Kafka Assets","Connector","Package to crawl Apache Kafka Assets and publish to GenMeta for discovery"],
 ["Asset Import","Utility","Import assets from a CSV file."],
 ["Astronomer Airflow Assets","Orchestrator",ol("Astronomer Airflow")],
 ["Ataccama","Connector","Package to ingest data quality metadata from Ataccama for GenMeta Tables/Views and Columns."],
 ["Athena Assets","Connector","Package to crawl Athena assets and publish to GenMeta for discovery."],
 ["GenMeta Lakehouse","Utility","Deploy and connect to your GenMeta Lakehouse."],
 ["AWS Lambda Trigger","Orchestrator","Package to trigger and wait for AWS Lambda function to finish"],
 ["AWS SageMaker Unified Studio","Connector","Package to crawl SageMaker Unified Studio and publish to GenMeta for discovery"],
 ["Azure Data Factory","Orchestrator","Connects to Azure Data Factory via the Azure REST API and extracts full metadata into GenMeta. Supported entity types: Pipelines, Activities."],
 ["Azure Data Lake Storage","Connector",crawl("Azure Data Lake Storage")],
 ["Azure Event Hubs Assets","Connector","Catalog Azure Event Hubs namespaces and event hubs in GenMeta. Gain visibility into event streams, lineage, and governance for your Azure-based messaging platform."],
 ["Bigeye","Connector","Package to ingest data quality metadata from Bigeye for GenMeta Tables/Views and Columns."]
];
const moreConn=["BigQuery Assets","Cassandra Assets","ClickHouse Assets","Cloud SQL (MySQL)","Cloud SQL (PostgreSQL)","Confluent Kafka Assets","Confluent Schema Registry","Azure Cosmos DB Assets","Couchbase Assets","Databricks Assets","Dataplex","dbt Cloud Assets","dbt Core Assets","IBM Db2 Assets","Domo Assets","Dremio Assets","Elasticsearch Assets","Fivetran Assets","Google Cloud Storage","Great Expectations","Hive Assets","IBM Cognos Analytics","Informatica PowerCenter","Looker Assets","MariaDB Assets","Matillion Assets","Metabase Assets","Microsoft Fabric Assets","Microsoft Purview Assets","Microsoft SQL Server Assets","Mode Assets","MongoDB Assets","Monte Carlo","MySQL Assets","Netezza Assets","Oracle Assets","Oracle Analytics Cloud","PostgreSQL Assets","Power BI Assets","Presto Assets","Qlik Sense Cloud","Qlik Sense Enterprise","Amazon QuickSight Assets","Amazon Redshift Assets","Redash Assets","Salesforce Assets","SAP HANA Assets","SAP S/4HANA","SAP BusinessObjects","SharePoint Online","Sigma Assets","Sisense Assets","Snowflake Assets","Soda","Spark Assets","Starburst Galaxy","Azure Synapse Analytics Assets","Tableau Assets","Teradata Assets","ThoughtSpot Assets","Trino Assets","Vertica Assets","Workday Assets","Amazon S3 Assets","Amazon Aurora (MySQL)","Amazon Aurora (PostgreSQL)","Amazon EMR Assets","AWS Glue Assets","Azure SQL Database Assets","Google Pub/Sub Assets","Kafka Connect Assets"];
const miners=["BigQuery Miner","Databricks Miner","Snowflake Miner","Amazon Redshift Miner","Teradata Miner","Microsoft SQL Server Miner","Oracle Miner","PostgreSQL Miner","Athena Miner"];
const extra=[["Asset Export (Basic)","Utility","Export asset metadata to a CSV file on a schedule."],["Casework Classifier","Custom","Classifies casework reference numbers and tags matching columns for stewardship review."]];
const rest=[...moreConn.map(n=>[n,"Connector",/Great Expectations|Monte Carlo|Soda/.test(n)?`Package to ingest data quality metadata from ${n} for GenMeta Tables/Views and Columns.`:/Spark/.test(n)?ol("Spark"):crawl(n.replace(/ Assets$/,""))]),...miners.map(n=>[n,"Miner",`Package to mine query history from ${n.replace(" Miner","")} to build lineage and usage metrics in GenMeta.`]),...extra];
const connected=["Snowflake Assets","Databricks Assets","Amazon S3 Assets","Microsoft SQL Server Assets","Confluent Kafka Assets","Power BI Assets","Asset Import","Snowflake Miner"];
const ini=n=>{const w=n.replace(/\(.*?\)/g,"").split(/[\s/-]+/).filter(x=>x&&!/^(Assets|Amazon|AWS|Azure|Apache|Microsoft|Google|Cloud|IBM|SAP|GenMeta)$/.test(x));const f=(w[0]||n);return (f.length<=3?f:f.slice(0,2)).toUpperCase()};
MKT.length=0;
const all=[...V,...rest.sort((a,b)=>a[0].localeCompare(b[0],"en",{sensitivity:"base"}))];all.forEach(([n,pc,d],i)=>MKT.push({id:"p"+i,n,cat:pc,pc,pub:"Rplus",by:"Rplus",v:"1.0.0",st:connected.includes(n)?"installed":"install",tile:ini(n),d,adds:pc==="Miner"?"Query-log lineage and usage":pc==="Orchestrator"?"Pipeline assets and run lineage":pc==="Utility"?"Platform utility":pc==="Custom"?"Estate-specific package":"New connector and its extraction package",perm:pc==="Connector"||pc==="Miner"?"Credential for the source system":"GenMeta admin"}));
})();
function renderMarket(){
  const cats=["Connector","Miner","Orchestrator","Utility","Custom"],q=state.mq.toLowerCase();
  const list=MKT.filter(m=>(state.mcat==="All"||m.pc===state.mcat)&&`${m.n} ${m.d}`.toLowerCase().includes(q));
  $("#view").innerHTML=shell(`
  <div class="mkbar"><div class="pills">${["All",...cats].map(c=>`<button data-mcat="${c}" class="pill2 ${state.mcat===c?"on":""}">${c==="All"?I.grid:""}${c}<span>${c==="All"?MKT.length:MKT.filter(m=>m.pc===c).length}</span></button>`).join("")}</div>
    <label class="search mks">${I.search}<input id="mq" placeholder="Search packages" value="${esc(state.mq)}" aria-label="Search packages"></label></div>
  <div class="pkgs">${list.map(m=>`<button class="pkg" data-mdet="${m.id}"><div class="pk-h"><span class="pk-logo">${m.tile}<i class="pk-ok" title="Verified by Rplus">✓</i></span><div><b>${esc(m.n)}</b><span>By Rplus</span></div></div><p>${esc(m.d)}</p></button>`).join("")||'<p class="sub">No packages match.</p>'}</div>`);
  wireShell();
  $$("[data-mcat]").forEach(b=>b.onclick=()=>{state.mcat=b.dataset.mcat;render()});
  const mq=$("#mq");mq.oninput=()=>{state.mq=mq.value;const p=mq.selectionStart;render();const n=$("#mq");n.focus();n.setSelectionRange(p,p)};
  $$("[data-mdet]").forEach(el=>el.onclick=()=>openMkt(el.dataset.mdet));
}

/* ---------- wizard ---------- */
const wz={step:0,cat:"All",q:"",pick:null,tested:0,name:"",auto:true,freq:"Every 30 min",evt:true,inc:true};
function openWizard(pick){Object.assign(wz,{step:pick?1:0,cat:"All",q:"",pick:pick||null,tested:0,name:pick?pick+" – Finance":""});renderWizard()}
function closeWizard(){$("#modalRoot").innerHTML=""}
function renderWizard(){
  const steps=["Choose connector","Connect","Scope","Collection & review"],cats=["All",...new Set(CONNECTORS.map(c=>c[1]))];let body="";
  if(wz.step===0){const list=CONNECTORS.filter(c=>(wz.cat==="All"||c[1]===wz.cat)&&c[0].toLowerCase().includes(wz.q.toLowerCase()));
    body=`<div class="gal" style="margin:0;grid-template-columns:170px 1fr"><div class="cats">${cats.map(c=>`<button data-wcat="${c}" class="${wz.cat===c?"on":""}"><span>${c}</span></button>`).join("")}</div><div><label class="search" style="max-width:none">${I.search}<input id="wq" placeholder="Search connectors" value="${esc(wz.q)}" aria-label="Search connectors"></label><div class="ctiles">${list.map(c=>`<button class="ctile ${wz.pick===c[0]?"on":""}" data-pick="${c[0]}"><div class="t"><span class="tile" style="width:38px;height:38px">${c[2]}</span><div><b>${c[0]}</b><br><span>${c[1]}</span></div></div></button>`).join("")}</div></div></div>`}
  else if(wz.step===1){const checks=["Reach the host over the network","Authenticate with the credential","Read permission on metadata views","Read column statistics (for profiling)"];
    body=`<div class="two"><div><div class="field"><label for="wname">Source name</label><input id="wname" value="${esc(wz.name)}"></div>
      <div class="field"><label for="wmeth">Connection method</label><select id="wmeth"><option>Agentless</option><option>Agent (on-premise)</option><option>API</option></select></div>
      <div class="field"><label for="whost">Host / account</label><input id="whost" class="mono" value="rplus-uk.eu-west-2"></div>
      <div class="field"><label for="wcred">Credential</label><select id="wcred"><option>genmeta-svc (key pair) · used by 2 sources</option><option>+ New credential</option></select></div>
      <div class="two" style="gap:12px"><div class="field"><label for="wown">Owner</label><select id="wown"><option>Rajesh</option><option>PK</option><option>Raghav</option></select></div><div class="field"><label for="wdom">Domain</label><select id="wdom"><option>Customer</option><option>Orders</option><option>Casework</option><option>Events</option></select></div></div></div>
      <div><button class="btn" id="wtest">${I.check}Test connection</button><ul class="checks">${checks.map((c,i)=>`<li><span class="ci ${wz.tested>i+1||wz.tested===5?"ok":wz.tested===i+1?"run":""}">${wz.tested>i+1||wz.tested===5?"✓":""}</span>${c}</li>`).join("")}</ul><p class="sub">${wz.tested===5?"All 4 checks passed.":"Each check reports separately, so you can see exactly what to fix."}</p></div></div>`}
  else if(wz.step===2){body=`<div class="two"><div><ul class="tree"><li><label><input type="checkbox" checked> <b>FINANCE_DB</b> <span class="sub">3 schemas</span></label><ul><li><label><input type="checkbox" checked> PUBLIC <span class="sub">12 tables</span></label></li><li><label><input type="checkbox" checked> LEDGER <span class="sub">7 tables</span></label></li><li><label><input type="checkbox"> SCRATCH <span class="sub">31 tables</span></label></li></ul></li></ul></div>
    <div><label class="toggle"><input type="checkbox" class="swi" id="wauto" ${wz.auto?"checked":""}><span class="sw"></span>Include new schemas automatically</label><div class="field" style="margin-top:8px"><label for="wexcl">Exclude pattern</label><input id="wexcl" class="mono" value="*_TMP, *_BACKUP"></div><div class="box" style="background:var(--panel-2)"><b style="font-weight:500">Preview</b><p class="sub" style="margin:4px 0 0">About 19 tables and 214 columns on the first scan.</p></div></div></div>`}
  else{body=`<div class="two"><div><div class="field"><label for="wfreq">Scan frequency</label><select id="wfreq">${["Every 15 min","Every 30 min","Hourly","Daily 02:00"].map(f=>`<option ${f===wz.freq?"selected":""}>${f}</option>`).join("")}</select></div>
    <label class="toggle"><input type="checkbox" class="swi" id="wevt" checked><span class="sw"></span>Event-driven trigger</label><label class="toggle"><input type="checkbox" class="swi" id="winc" checked><span class="sw"></span>Incremental harvest</label></div>
    <div class="box" style="background:var(--panel-2)"><h3>Review</h3><dl class="kv" style="margin-top:10px"><dt>Connector</dt><dd>${wz.pick}</dd><dt>Name</dt><dd>${esc(wz.name)}</dd><dt>Scope</dt><dd>FINANCE_DB: PUBLIC, LEDGER</dd><dt>New schemas</dt><dd>${wz.auto?"Included automatically":"Ignored"}</dd><dt>Collection</dt><dd>${wz.freq} · event-driven · incremental</dd></dl></div></div>`}
  const can=wz.step===0?!!wz.pick:wz.step===1?wz.tested===5:true;
  $("#modalRoot").innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="wt"><div class="mhead"><h3 id="wt">Connect a source</h3><button class="btn ghost sm" id="wclose" aria-label="Close">${I.x}</button></div>
    <div class="wsteps">${steps.map((s,i)=>`<span class="wst ${i===wz.step?"on":i<wz.step?"done":""}"><b>${i<wz.step?"✓":i+1}</b>${s}</span>`).join("")}</div><div class="mbody">${body}</div>
    <div class="mfoot"><button class="btn" id="wback" ${wz.step===0?"hidden":""}>Back</button><span class="sub">${wz.step===0&&wz.pick?"Selected: "+wz.pick:""}</span><div class="actions">${wz.step<3?`<button class="btn primary" id="wnext" ${can?"":"disabled"}>Continue</button>`:`<button class="btn" id="wsave">Save</button><button class="btn primary" id="wrun">${I.play}Save & scan now</button>`}</div></div></div></div>`;
  $("#wclose").onclick=closeWizard;$("#scrim").onclick=e=>{if(e.target.id==="scrim")closeWizard()};
  $$("[data-wcat]").forEach(b=>b.onclick=()=>{wz.cat=b.dataset.wcat;renderWizard()});
  $$("[data-pick]").forEach(b=>b.onclick=()=>{wz.pick=b.dataset.pick;wz.name=wz.pick+" – Finance";renderWizard()});
  const wq=$("#wq");if(wq)wq.oninput=()=>{wz.q=wq.value;const p=wq.selectionStart;renderWizard();const n=$("#wq");n.focus();n.setSelectionRange(p,p)};
  const wn=$("#wname");if(wn)wn.oninput=()=>wz.name=wn.value;
  const wa=$("#wauto");if(wa)wa.onchange=()=>wz.auto=wa.checked;
  const wf=$("#wfreq");if(wf)wf.onchange=()=>wz.freq=wf.value;
  const wt=$("#wtest");if(wt)wt.onclick=()=>{let k=1;wz.tested=1;renderWizard();const iv=setInterval(()=>{k++;wz.tested=k>4?5:k;renderWizard();if(k>4)clearInterval(iv)},600)};
  const nx=$("#wnext");if(nx)nx.onclick=()=>{wz.step++;renderWizard()};
  const bk=$("#wback");if(bk)bk.onclick=()=>{wz.step--;renderWizard()};
  const fin=run=>{const c=CONNECTORS.find(x=>x[0]===wz.pick);sources.unshift({id:"n"+Date.now(),name:wz.name,tech:c[0],tile:c[2],desc:`${c[1]} — newly connected`,deploy:["Agentless","Cloud (AWS)"],domains:["Customer"],sens:[],schemaList:[["PUBLIC",12],["LEDGER",7]],tables:0,freq:wz.freq.replace("Every ",""),last:run?"running now":"never",next:"after first scan",status:run?"scanning":"healthy",conn:true,owners:["Rajesh"],keys:0,layers:0,lineage:0,sensitive:0,coverage:{Owner:100,Description:0,Classification:0,"Glossary terms":0},sensDetail:{},spark:[1],caps:{Metadata:1,Lineage:1,Profiling:0,Classification:1,Glossary:0},drift:[],banner:{t:run?"First scan running":"Saved, not scanned yet",d:"About 19 tables will be catalogued."}});
    closeWizard();state.tab="sources";state.view="list";state.filter="all";render();toast(run?`${wz.name} connected. First scan started.`:`${wz.name} saved`);
    if(run)setTimeout(()=>{const s=sources[0];Object.assign(s,{status:"healthy",tables:19,last:"just now",sensitive:14,sens:["FINANCIAL"],sensDetail:{PII:5,FINANCIAL:9},spark:[19],coverage:{Owner:100,Description:10,Classification:62,"Glossary terms":0},banner:{t:"First scan completed",d:"19 tables catalogued · 14 sensitive columns classified"}});render();toast(`${s.name}: 19 tables catalogued`)},3200)};
  const sv=$("#wsave");if(sv)sv.onclick=()=>fin(false);const rn=$("#wrun");if(rn)rn.onclick=()=>fin(true);
}

let tt;function toast(m){$("#toastRoot").innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>$("#toastRoot").innerHTML="",3400)}
function render(){crumb();if(state.view==="detail")return renderDetail();({sources:renderSources,connectors:renderConnectors,market:renderMarket,runs:renderRuns,changes:renderChanges,creds:renderCreds,bulk:renderBulk})[state.tab]()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modalRoot").innerHTML)closeWizard()});
render();
</script>
</body>
</html>
